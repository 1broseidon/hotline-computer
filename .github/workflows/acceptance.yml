# Test-only: no registry login, package permissions, or publication step.
name: desktop acceptance
on:
  pull_request:
  push:
    branches: [main, codex/desktop-040-release]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          build-args: |
            HOTLINE_BUILD_REVISION=${{ github.sha }}
            HOTLINE_BUILD_CHANNEL=development
          target: checks
          load: true
          tags: hotline-computer:checks
          cache-from: type=gha,scope=acceptance-${{ matrix.arch }}
          cache-to: type=gha,scope=acceptance-${{ matrix.arch }},mode=max,ignore-error=true
      - uses: docker/build-push-action@v7
        with:
          context: .
          build-args: |
            HOTLINE_BUILD_REVISION=${{ github.sha }}
            HOTLINE_BUILD_CHANNEL=development
          load: true
          tags: hotline-computer:candidate
          cache-from: type=gha,scope=acceptance-${{ matrix.arch }}
      - run: tests/run-image-acceptance.sh hotline-computer:candidate hotline-computer:checks acceptance
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: desktop-acceptance-${{ matrix.arch }}
          path: |
            acceptance/
            !acceptance/token
          if-no-files-found: error
