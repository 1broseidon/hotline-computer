<!doctype html><html lang="en"><meta charset="utf-8"><title>Computer acceptance · Forms</title><style>body{font:20px system-ui;background:#f1f4f2;color:#183529;margin:40px;max-width:950px}h1{font-size:34px}section{background:white;border:1px solid #bbcbbf;border-radius:12px;padding:24px;margin:24px 0}label{display:block;margin:12px 0}input,select,textarea,button{font:inherit;padding:8px;margin:5px}button{background:#173d2d;color:white;border:0;border-radius:5px;padding:12px 20px}fieldset{border:0}output{display:block;padding:16px;background:#e7f2e9} [hidden]{display:none!important}</style><h1>Computer acceptance · Forms</h1><p>Synthetic QA data only. Submissions stay on this computer.</p><section><h2>Simple form</h2><form id="simple"><label>Name<input id="name" name="name" required></label><label>Email<input id="email" name="email" type="email" required></label><label>Topic<select id="topic"><option value="">Choose a topic</option><option>Bug report</option><option>Feature request</option></select></label><label>Message<textarea id="message" required></textarea></label><label><input id="copy" type="checkbox">Keep a copy</label><button>Submit simple form</button></form><output id="simple-result" hidden></output></section><section><h2>Complex application</h2><p id="progress">Step 1 of 3 · Contact</p><form id="complex"><fieldset id="s1"><label>Applicant name<input id="applicant" required></label><label>Contact email<input id="contact" type="email" required></label><button type="button" id="next1">Next: project</button></fieldset><fieldset id="s2" hidden disabled><label>Project type<select id="project"><option>Personal</option><option>Team</option></select></label><label id="org-label" hidden>Organization<input id="org"></label><label>Start date<input id="date" type="date" required></label><label>QA notes file<input id="attachment" type="file" accept=".txt" required></label><label>Platforms<select id="platforms" multiple><option>Linux</option><option>macOS</option><option>Windows</option></select></label><button type="button" id="back1">Back to contact</button><button type="button" id="next2">Next: review</button></fieldset><fieldset id="s3" hidden disabled><h3>Review application</h3><pre id="review"></pre><label><input id="terms" type="checkbox" required>I confirm this synthetic test application</label><button type="button" id="back2">Back to project</button><button id="submit">Submit application</button></fieldset></form><output id="complex-result" hidden></output></section><script>
const $=id=>document.getElementById(id);const simple=$('simple');
simple.onsubmit=e=>{e.preventDefault();const value={name:$('name').value,email:$('email').value,topic:$('topic').value,message:$('message').value,copy:$('copy').checked};localStorage.setItem('simple-result',JSON.stringify(value));$('simple-result').hidden=false;$('simple-result').textContent='Submitted: '+JSON.stringify(value);};
function step(n){for(let i=1;i<=3;i++){$('s'+i).hidden=i!==n;$('s'+i).disabled=i!==n;}$('progress').textContent='Step '+n+' of 3 · '+['Contact','Project','Review'][n-1];}
function data(){return {name:$('applicant').value,email:$('contact').value,project:$('project').value,organization:$('org').value,date:$('date').value,file:$('attachment').files[0]?.name,platforms:[...$('platforms').selectedOptions].map(x=>x.value)};}
$('next1').onclick=()=>{if($('complex').reportValidity())step(2);};$('project').onchange=()=>{$('org-label').hidden=$('project').value!=='Team';$('org').required=$('project').value==='Team';};$('back1').onclick=()=>step(1);$('back2').onclick=()=>step(2);$('next2').onclick=()=>{if($('complex').reportValidity()){$('review').textContent=JSON.stringify(data(),null,2);step(3);}};
$('complex').onsubmit=e=>{e.preventDefault();$('submit').disabled=true;$('submit').textContent='Submitting…';setTimeout(()=>{const value=data();localStorage.setItem('complex-result',JSON.stringify(value));$('complex-result').hidden=false;$('complex-result').textContent='Application QA-040 accepted: '+JSON.stringify(value);$('complex').hidden=true;$('progress').textContent='Complete';},800);};
</script></html>
