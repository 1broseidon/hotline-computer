<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign in</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f5f5f2;color:#202020;font:16px sans-serif}form{width:300px;padding:32px;border:1px solid #ddd;border-radius:8px;background:white}label{display:block;margin:20px 0 6px}input{box-sizing:border-box;width:100%;padding:10px;border:1px solid #bbb;border-radius:4px;font:inherit}button{width:100%;margin-top:24px;padding:12px;border:0;border-radius:4px;background:#202020;color:white;font:inherit}</style>
<form onsubmit="event.preventDefault()"><h1>Sign in</h1><label for="email">Email</label><input id="email" type="email" autocomplete="username"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password"><button>Sign in</button></form></html>
