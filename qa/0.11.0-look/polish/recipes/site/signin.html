<!doctype html>
<title>Sign in · Fieldnote</title>
<style>body{font:16px system-ui,sans-serif;max-width:420px;margin:80px auto}label{display:block;margin:14px 0 4px}input{width:100%;padding:10px;font-size:16px;box-sizing:border-box}</style>
<h1>Sign in</h1>
<form onsubmit="event.preventDefault()">
  <label for="email">Email</label><input id="email" name="email" type="email" autocomplete="username">
  <label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password">
  <label for="otp">Authentication code</label><input id="otp" name="otp" inputmode="numeric" autocomplete="one-time-code">
  <p><button id="go">Sign in</button></p>
</form>
<script>
  // What a framework sees: input events, not just a value.
  window.seen = {email: 0, password: 0, otp: 0};
  for (const id of ['email', 'password', 'otp']) document.getElementById(id).addEventListener('input', () => window.seen[id]++);
</script>
