[package]
name = "hotline-computer"
description = "A small Linux desktop for a coding agent: one binary boots it, owns it, and serves it over MCP."
version = "0.8.1"
license = "MIT OR Apache-2.0"
edition = "2024"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.53", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls"] }
axum = { version = "0.8.9", default-features = false, features = ["tokio", "http1", "json", "query", "ws"] }
tokio-util = { version = "0.7", features = ["io"] }
rmcp = { version = "=3.2.0", features = [
    "client",
    "server",
    "transport-streamable-http-client-reqwest",
    "transport-streamable-http-server",
    "reqwest",
] }
futures-util = "0.3.34"
base64 = "0.22.1"
# The agent is the window manager, the screenshotter, the screen streamer and
# the person's hands, so it talks X11 itself: XGetImage, EWMH, the redirect of
# every map and configure, DAMAGE for what changed, XTEST for input.
x11rb = { version = "=0.14.0", default-features = false, features = ["damage", "shm", "xtest"] }
# Odilia's protocol crate is the typed route to the desktop accessibility tree.
atspi = { version = "=0.30.0", default-features = false, features = ["proxies", "tokio", "zbus"] }
# Chromium is visible on the desktop while this drives its DevTools protocol.
chromiumoxide = { version = "=0.9.1", default-features = false }
# Screenshots leave as PNG and the wallpaper mark and dock icons arrive as PNG.
png = "=0.18.1"
# PID 1 duties: fork, block and wait on signals, reap what the kernel hands us.
libc = "0.2"
sha2 = "0.10"
# The bar and its menus are drawn as pixels: antialiased text from the image's
# DejaVu Sans rather than X core bitmap fonts.
fontdue = "0.9.4"
# The clock in the bar shows the host's local time; the desk passes TZ.
chrono = { version = "0.4", default-features = false, features = ["clock"] }
hmac = "0.12"
sha1 = "0.10"
data-encoding = "2"

[dev-dependencies]
tempfile = "3.27.0"
# The contract test opens the viewer's WebSocket the way the page does.
tokio-tungstenite = "0.28"
