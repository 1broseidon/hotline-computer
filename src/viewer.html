<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hotline Computer</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2064%2064%22%20class%3D%22mark%22%20aria-hidden%3D%22true%22%3E%0A%09%0A%09%3Cmask%20id%3D%22hotline-pupils%22%20maskUnits%3D%22userSpaceOnUse%22%20x%3D%220%22%20y%3D%220%22%20width%3D%2264%22%20height%3D%2264%22%3E%0A%09%09%3Crect%20width%3D%2264%22%20height%3D%2264%22%20fill%3D%22%23fff%22%20/%3E%0A%09%09%3Crect%20x%3D%2214.5%22%20y%3D%2228%22%20width%3D%2211%22%20height%3D%224%22%20rx%3D%222%22%20fill%3D%22%23000%22%20/%3E%0A%09%09%3Crect%20x%3D%2238.5%22%20y%3D%2228%22%20width%3D%2211%22%20height%3D%224%22%20rx%3D%222%22%20fill%3D%22%23000%22%20/%3E%0A%09%3C/mask%3E%0A%09%3Cg%20mask%3D%22url%28%23hotline-pupils%29%22%20fill%3D%22%23ececef%22%3E%0A%09%09%3Crect%20x%3D%224%22%20y%3D%2230%22%20width%3D%2256%22%20height%3D%2218%22%20rx%3D%226%22%20/%3E%0A%09%09%3Ccircle%20cx%3D%2220%22%20cy%3D%2230%22%20r%3D%2210.5%22%20/%3E%0A%09%09%3Ccircle%20cx%3D%2244%22%20cy%3D%2230%22%20r%3D%2210.5%22%20/%3E%0A%09%3C/g%3E%0A%3C/svg%3E%0A">
<style>
@font-face { font-family: Geist; src: url('/assets/fonts/Geist-Regular.woff2') format('woff2'); font-weight: 400; font-display: swap; }
@font-face { font-family: Geist; src: url('/assets/fonts/Geist-Medium.woff2') format('woff2'); font-weight: 500; font-display: swap; }
@font-face { font-family: Geist; src: url('/assets/fonts/Geist-SemiBold.woff2') format('woff2'); font-weight: 600; font-display: swap; }
@font-face { font-family: 'Geist Mono'; src: url('/assets/fonts/GeistMono-Regular.woff2') format('woff2'); font-weight: 400; font-display: swap; }
:root {
  --ground:#0b0b0d; --bar:#111114; --bar-rule:#222227; --surface:#17171b;
  --raised:#1f1f25; --raised-edge:#2e2e35; --chip:#19191e; --chip-edge:#26262c; --rule:#2a2a30;
  --ink:#ececef; --ink-2:#b4b4ba; --pill-ink:#a2a2a9; --muted:#8e8e95;
  --agent:#8fb8ff; --you:#f0c27a; --ok:#86d69c; --fail:#ff8f80;
  --fill:rgba(23,23,27,.92); --shadow:0 18px 40px rgba(0,0,0,.5);
}
* { box-sizing:border-box; }
[hidden] { display:none !important; }
html { min-height:100%; background:var(--ground); }
body { margin:0; min-height:100vh; color:var(--ink); font:13px Geist,sans-serif; }
#stage { min-height:calc(100vh - 72px); display:flex; align-items:center; justify-content:center; }
body.native #stage { width:max-content; min-width:100%; padding-bottom:16px; }
canvas { display:block; touch-action:none; cursor:default; flex:none; }
button { border:0; font:inherit; font-weight:400; cursor:pointer; background:transparent; color:var(--ink); }
button:disabled { opacity:.45; cursor:default; }
button:focus-visible, canvas:focus-visible, #toast:focus-visible { outline:2px solid var(--agent); outline-offset:2px; }
button svg { width:16px; height:16px; flex:none; fill:none; stroke:currentColor; stroke-width:1.5; stroke-linecap:round; stroke-linejoin:round; }
.mark { display:block; width:16px; height:16px; flex:none; color:var(--ink); }
#placeholder { position:fixed; inset:0 0 72px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; padding:24px; text-align:center; color:var(--muted); }
#placeholder .mark { width:64px; height:64px; }
#placeholder p { max-width:380px; margin:0; line-height:1.6; }
#bar { position:fixed; z-index:10; left:50%; bottom:12px; transform:translateX(-50%); display:flex; align-items:center; gap:4px; height:48px; max-width:calc(100vw - 24px); padding:0 6px 0 12px; border-radius:14px; background:var(--fill); border:1px solid var(--raised-edge); box-shadow:var(--shadow); backdrop-filter:blur(8px); white-space:nowrap; }
#bar.driving { border-color:color-mix(in srgb,var(--you) 45%,transparent); }
#bar .status { display:flex; align-items:center; gap:8px; min-width:0; padding-right:10px; margin-right:2px; }
#bar .status.divided { border-right:1px solid var(--rule); }
#status { overflow:hidden; text-overflow:ellipsis; max-width:220px; }
.dot { width:7px; height:7px; border-radius:50%; background:var(--ok); flex:none; }
#bar.lost .dot { background:var(--muted); }
#bar.stalled .dot, #bar.held .dot, #bar.driving .dot { background:var(--you); }
#bar.driving #status { color:var(--you); }
.sub { color:var(--muted); }
#job-count.failed { color:var(--fail); }
#bar button { height:32px; padding:0 10px; border-radius:8px; flex:none; }
#bar button:hover:not(:disabled), #settings button:hover { background:var(--raised); }
#bar .icon { width:32px; padding:8px; }
#bar .primary, #bar .primary:hover:not(:disabled) { background:var(--you); color:var(--ground); font-weight:500; }
#bar #back { background:var(--chip-edge); }
#bar .quiet { color:var(--ink-2); }
#bar [aria-pressed=true] { background:var(--raised); color:var(--agent); }
#keys { position:fixed; bottom:66px; left:50%; transform:translateX(-50%); color:var(--muted); font-size:11px; pointer-events:none; z-index:10; }
#pointer { position:fixed; left:0; top:0; width:22px; height:30px; pointer-events:none; opacity:0; transition:transform .14s ease-out,opacity .25s; z-index:5; }
#pointer.shown, #intent.shown { opacity:1; }
#intent { position:fixed; display:flex; align-items:center; gap:6px; height:28px; max-width:calc(100vw - 16px); padding:0 10px 0 4px; border-radius:14px; background:var(--agent); color:var(--ground); font-size:12.5px; font-weight:500; pointer-events:none; opacity:0; transition:opacity .25s; z-index:5; }
#intent-initial { display:grid; place-items:center; width:20px; height:20px; border-radius:50%; background:rgba(11,11,13,.12); flex:none; }
#intent-label { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.ring { position:fixed; width:28px; height:28px; margin:-14px 0 0 -14px; border:2px solid var(--agent); border-radius:50%; pointer-events:none; z-index:4; animation:ring .45s ease-out forwards; }
.ring.right { border-color:var(--you); }
@keyframes ring { from { transform:scale(.3); opacity:.9; } to { transform:scale(1.4); opacity:0; } }
.sheet { position:fixed; right:12px; bottom:72px; border-radius:14px; background:var(--fill); border:1px solid var(--raised-edge); box-shadow:var(--shadow); backdrop-filter:blur(8px); z-index:20; }
#settings { padding:6px; width:220px; }
#settings button { display:flex; width:100%; align-items:center; justify-content:space-between; text-align:left; min-height:32px; padding:6px 10px; border-radius:8px; }
#settings [aria-pressed=true] .check { color:var(--agent); }
#settings [aria-pressed=false] .check { visibility:hidden; }
#files { width:min(440px,calc(100vw - 24px)); max-height:min(65vh,540px); display:flex; flex-direction:column; }
#files header { display:flex; align-items:center; gap:4px; padding:8px 8px 8px 14px; border-bottom:1px solid var(--rule); }
#files-path { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font:12px 'Geist Mono',monospace; }
#files header button { width:28px; height:28px; border-radius:8px; display:grid; place-items:center; }
#files header button:hover { background:var(--raised); }
#files.arriving { outline:2px dashed var(--agent); outline-offset:-2px; }
#files-list { list-style:none; margin:0; padding:6px; overflow-y:auto; }
#files-list li { position:relative; }
.file-row { display:flex; width:100%; gap:10px; align-items:center; text-align:left; padding:9px 8px; border-radius:8px; }
.file-row:hover { background:var(--raised); }
.file-row .name, .upload .name { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.file-row.dir .name::after { content:'/'; color:var(--muted); }
.file-row .details { color:var(--muted); text-align:right; font-size:11px; line-height:1.5; flex:none; }
.file-row .download { opacity:0; }
.file-row:hover .download, .file-row:focus-visible .download { opacity:1; }
.empty, .upload { color:var(--muted); padding:10px 8px; }
.upload { display:flex; gap:8px; position:relative; }
.progress { position:absolute; left:8px; right:8px; bottom:3px; height:2px; background:var(--chip-edge); }
.progress span { display:block; width:0; height:100%; background:var(--agent); }
#toast { position:fixed; z-index:40; left:50%; bottom:82px; transform:translateX(-50%); max-width:calc(100vw - 24px); padding:10px 14px; border-radius:8px; background:var(--surface); border:1px solid var(--raised-edge); box-shadow:var(--shadow); color:var(--ink-2); line-height:1.4; cursor:pointer; transition:opacity .2s; }
#toast.error { color:var(--fail); }
#toast.quiet { opacity:0; pointer-events:none; }
@media(max-width:600px), (hover:none) {
  #sub, .hint, #bar .secondary { display:none; }
  #bar { gap:2px; padding-left:8px; }
  #bar button { padding:0 8px; }
  #bar .status { gap:6px; padding-right:6px; margin-right:0; }
  #status { max-width:120px; }
  #bar .icon { padding:8px; }
  .file-row .download { opacity:1; }
}
@media(prefers-reduced-motion:reduce) { #pointer, #intent, #toast { transition:none; } .ring { animation:none; } }
</style>
</head>
<body>
<div id="stage"><canvas id="screen" tabindex="0" width="1" height="1" role="img" aria-label="Agent's desktop" hidden></canvas></div>
<div id="placeholder"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" class="mark" aria-hidden="true">

	<mask id="placeholder-pupils" maskUnits="userSpaceOnUse" x="0" y="0" width="64" height="64">
		<rect width="64" height="64" fill="#fff" />
		<rect x="14.5" y="28" width="11" height="4" rx="2" fill="#000" />
		<rect x="38.5" y="28" width="11" height="4" rx="2" fill="#000" />
	</mask>
	<g mask="url(#placeholder-pupils)" fill="currentColor">
		<rect x="4" y="30" width="56" height="18" rx="6" />
		<circle cx="20" cy="30" r="10.5" />
		<circle cx="44" cy="30" r="10.5" />
	</g>
</svg>
<p id="placeholder-text">Connecting…</p></div>
<svg id="pointer" viewBox="0 0 22 30" aria-hidden="true"><path d="M2.5 1.5 L2.5 23 L8.6 17.6 L19 15.4 Z" fill="#8fb8ff" stroke="#0b0b0d" stroke-width="1.6" stroke-linejoin="round"/></svg>
<div id="intent" aria-hidden="true"><span id="intent-initial"></span><span id="intent-label"></span></div>
<div id="toast" class="quiet" role="alert" tabindex="0"></div>
<section id="files" class="sheet" aria-label="Files" hidden>
  <header><span id="files-path">Files</span>
    <button id="files-add" aria-label="Add files" title="Add files from your computer"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3v10M3 8h10"/></svg></button>
    <button id="files-up" aria-label="Up a folder" title="Up a folder"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 13V3M3 8l5-5 5 5"/></svg></button>
    <button id="files-close" aria-label="Close Files" title="Close Files"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="m4 4 8 8M12 4l-8 8"/></svg></button>
  </header>
  <input id="files-pick" type="file" multiple hidden><ul id="files-list"></ul>
</section>
<section id="settings" class="sheet" aria-label="Viewer settings" hidden>
  <button id="cmd-control" aria-pressed="true">Cmd as Ctrl <span class="check" aria-hidden="true">✓</span></button>
  <button id="settings-scale" aria-pressed="false">1:1 pixels <span class="check" aria-hidden="true">✓</span></button>
  <button id="settings-fullscreen">Fullscreen</button>
</section>
<div id="keys" hidden>keys → computer</div>
<div id="bar" class="lost">
  <span class="status" aria-live="polite"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" class="mark" aria-hidden="true">

	<mask id="status-pupils" maskUnits="userSpaceOnUse" x="0" y="0" width="64" height="64">
		<rect width="64" height="64" fill="#fff" />
		<rect x="14.5" y="28" width="11" height="4" rx="2" fill="#000" />
		<rect x="38.5" y="28" width="11" height="4" rx="2" fill="#000" />
	</mask>
	<g mask="url(#status-pupils)" fill="currentColor">
		<rect x="4" y="30" width="56" height="18" rx="6" />
		<circle cx="20" cy="30" r="10.5" />
		<circle cx="44" cy="30" r="10.5" />
	</g>
</svg>
<span class="dot" aria-hidden="true"></span><span id="status">Connecting…</span><span id="sub" class="sub"><span id="job-count"></span><span id="latency"></span></span></span>
  <button id="browse" class="quiet" aria-expanded="false" aria-controls="files" hidden>Files</button>
  <button id="paste" class="quiet" title="Ctrl+Alt+V pastes from your computer" hidden>Paste</button>
  <button id="control" class="primary" hidden>Take control</button>
  <button id="back" title="Give it back (Ctrl+Alt+Shift)" hidden>Give it back</button>
  <button id="scale" class="quiet secondary" aria-pressed="false" title="Show one screen pixel per device pixel">1:1</button>
  <button id="fullscreen" class="quiet icon secondary" aria-label="Fullscreen" title="Fullscreen"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M6 2H2v4m8-4h4v4M2 10v4h4m8-4v4h-4"/></svg></button>
  <button id="settings-toggle" class="quiet icon" aria-label="Settings" aria-expanded="false" aria-controls="settings" title="Settings"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 4h12M2 12h12M5 2v4m6 4v4"/></svg></button>
</div>
<script>
(() => {
  'use strict';
  const $ = id => document.getElementById(id);
  const canvas = $('screen'), context = canvas.getContext('2d'), bar = $('bar');
  const status = $('status'), sub = $('sub'), control = $('control'), paste = $('paste'), back = $('back'), browse = $('browse');
  const pointer = $('pointer'), intent = $('intent'), toast = $('toast'), placeholder = $('placeholder');
  const mac = /Mac|iPhone|iPad/i.test(navigator.userAgentData?.platform || navigator.platform);
  let token; try { token = decodeURIComponent(location.hash.slice(1)); } catch { token = location.hash.slice(1); }
  let socket, connected = false, hasOpened = false, driving = false, frameReady = false, stopped = false;
  let machine = { holder:'none', running:0, completed:0, failed:0, agent:{name:'Agent'} };
  let connectionText = 'Connecting…', reconnectAttempt = 0, nativeSize = false, cmdAsCtrl = true;
  let drawing = Promise.resolve(), hands, handsIdle, toastTimer, hinted = false;
  let pingID = 0, lastPong = 0, latency = null;
  const pings = new Map(), held = new Map(), pointers = new Map();

  function dismissToast() { clearTimeout(toastTimer); toast.classList.add('quiet'); toast.tabIndex = -1; }
  function say(text, error = false) {
    toast.textContent = text; toast.classList.toggle('error', error); toast.classList.remove('quiet'); toast.tabIndex = 0;
    clearTimeout(toastTimer); toastTimer = setTimeout(dismissToast, 6000);
  }
  toast.addEventListener('click', dismissToast);
  toast.addEventListener('keydown', event => { if (event.key === 'Enter' || event.key === 'Escape' || event.key === ' ') dismissToast(); });
  function send(message) {
    if (socket?.readyState !== WebSocket.OPEN) return;
    if (['move','button','key','wheel','paste'].includes(message.t)) dismissToast();
    socket.send(JSON.stringify(message));
  }
  function agentName() { return machine.agent?.name || 'Agent'; }
  function render() {
    const other = machine.holder === 'person' && !driving;
    const stalled = connected && performance.now() - lastPong >= 10000;
    bar.classList.toggle('lost', !connected); bar.classList.toggle('driving', driving);
    bar.classList.toggle('held', other); bar.classList.toggle('stalled', stalled);
    control.hidden = !connected || driving; control.disabled = other;
    paste.hidden = back.hidden = !(connected && driving); browse.hidden = !connected;
    $('keys').hidden = !(connected && driving && document.activeElement === canvas);
    $('job-count').classList.toggle('failed', !driving && machine.failed > 0);
    if (!connected) {
      status.textContent = connectionText; $('job-count').textContent = ''; $('latency').textContent = '';
    } else if (driving) {
      status.textContent = "You're driving"; $('job-count').textContent = '· agent paused'; $('latency').textContent = stalled ? ' · stalled' : '';
    } else {
      status.textContent = other ? 'Someone else is driving' : `Watching ${agentName()}`;
      $('job-count').textContent = machine.failed ? `· ${machine.failed} failed · ${machine.running} running` : `· ${machine.running} jobs`;
      $('latency').textContent = stalled ? ' · stalled' : latency === null ? ' · live' : ` · live ${latency} ms`;
    }
    sub.hidden = !$('job-count').textContent && !$('latency').textContent;
    const visibleButtons = [...bar.querySelectorAll('button')].some(button => !button.hidden && getComputedStyle(button).display !== 'none');
    bar.querySelector('.status').classList.toggle('divided', visibleButtons);
    placeholder.hidden = frameReady;
    canvas.hidden = !frameReady;
    $('placeholder-text').textContent = connected ? 'Waiting for the screen…' : connectionText;
    if (driving || !connected) { pointer.classList.remove('shown'); intent.classList.remove('shown'); }
  }
  function fit() {
    const scale = nativeSize ? 1 / (devicePixelRatio || 1) : Math.min(innerWidth / canvas.width, Math.max(1, innerHeight - 72) / canvas.height);
    canvas.style.width = Math.floor(canvas.width * scale) + 'px';
    canvas.style.height = Math.floor(canvas.height * scale) + 'px';
    document.body.classList.toggle('native', nativeSize);
    placePointer();
  }
  function toggleScale() {
    nativeSize = !nativeSize;
    for (const id of ['scale','settings-scale']) $(id).setAttribute('aria-pressed', String(nativeSize));
    fit();
  }
  $('scale').addEventListener('click', toggleScale); $('settings-scale').addEventListener('click', toggleScale);
  addEventListener('resize', () => { fit(); render(); }); addEventListener('scroll', placePointer);
  function placePointer() {
    if (!hands || !frameReady) return;
    const rect = canvas.getBoundingClientRect();
    const x = rect.left + hands.x * rect.width / canvas.width, y = rect.top + hands.y * rect.height / canvas.height;
    pointer.style.transform = `translate(${x}px,${y}px)`;
    intent.style.left = Math.max(8, Math.min(x + 22, innerWidth - intent.offsetWidth - 8)) + 'px';
    intent.style.top = Math.max(8, Math.min(y - 2, innerHeight - 36)) + 'px';
    return [x,y];
  }
  function showHands(message) {
    hands = message;
    $('intent-initial').textContent = [...agentName()][0]?.toUpperCase() || 'A';
    $('intent-label').textContent = message.intent ? `${agentName()} · ${message.intent}` : '';
    const at = placePointer();
    pointer.classList.toggle('shown', !driving && frameReady);
    intent.classList.toggle('shown', !driving && frameReady && !!message.intent);
    if (message.button && message.down && !driving && at) {
      const ring = document.createElement('div'); ring.className = 'ring' + (message.button === 3 ? ' right' : '');
      ring.style.left = at[0] + 'px'; ring.style.top = at[1] + 'px'; document.body.append(ring);
      setTimeout(() => ring.remove(), 500);
    }
    clearTimeout(handsIdle); handsIdle = setTimeout(() => { pointer.classList.remove('shown'); intent.classList.remove('shown'); }, 2000);
  }
  function ping() {
    if (!connected) return;
    const id = ++pingID, now = performance.now(); pings.set(id, now);
    for (const [old, sent] of pings) if (now - sent > 30000) pings.delete(old);
    send({t:'ping',id});
  }
  setInterval(ping, 5000); setInterval(render, 1000);
  async function diagnose() {
    try {
      const response = await fetch(fileUrl('/files',''), {signal:AbortSignal.timeout(3000)});
      if (response.status === 401) {
        stopped = true; connectionText = 'This link is missing its key. Open it from Hotline, or add #<token> to the address.';
        return;
      }
    } catch { /* Health distinguishes an unavailable computer from a refused socket. */ }
    try {
      const response = await fetch('/health', {signal:AbortSignal.timeout(3000)});
      if (!response.ok) throw new Error();
    } catch { connectionText = "The computer isn't running."; }
  }
  function connect() {
    if (stopped) return;
    const ws = new WebSocket(`${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/ws?token=${encodeURIComponent(token)}`);
    socket = ws; ws.binaryType = 'arraybuffer';
    ws.onopen = () => {
      if (ws !== socket) return;
      connected = hasOpened = true; reconnectAttempt = 0; driving = false; frameReady = false;
      lastPong = performance.now(); latency = null; pings.clear(); render(); ping();
    };
    ws.onclose = async () => {
      if (ws !== socket) return;
      connected = driving = frameReady = false; held.clear(); releasePointers(false); pings.clear();
      connectionText = hasOpened ? 'Reconnecting…' : 'Connecting…'; render();
      if (!hasOpened) await diagnose();
      render();
      if (!stopped) setTimeout(connect, [1000,2000,4000,8000,15000][Math.min(reconnectAttempt++,4)]);
    };
    ws.onmessage = event => {
      if (ws !== socket) return;
      if (typeof event.data === 'string') {
        let message; try { message = JSON.parse(event.data); } catch { return; }
        if (message.t === 'state') { machine = message; driving = !!message.driving; render(); }
        if (message.t === 'pointer') showHands(message);
        if (message.t === 'pong' && pings.has(message.id)) {
          lastPong = performance.now(); latency = Math.round(lastPong - pings.get(message.id)); pings.delete(message.id); render();
        }
        if (message.t === 'paste') say('Pasted');
        if (message.t === 'error') { if (!message.driving) { driving = false; letGo(); } render(); say(message.error, true); }
        return;
      }
      const data = event.data;
      if (data.byteLength < 12) return;
      const view = new DataView(data), [x,y,w,h,sw,sh] = [0,2,4,6,8,10].map(offset => view.getUint16(offset,true));
      if (!w || !h || !sw || !sh || x + w > sw || y + h > sh) return;
      drawing = drawing.then(async () => {
        const bitmap = await createImageBitmap(new Blob([data.slice(12)],{type:'image/png'}));
        try {
          if (ws !== socket || !connected) return;
          if (canvas.width !== sw || canvas.height !== sh) { canvas.width = sw; canvas.height = sh; fit(); }
          context.drawImage(bitmap,x,y); frameReady = true; render();
        } finally { bitmap.close(); }
      }).catch(() => {});
    };
  }
  addEventListener('hashchange', () => location.reload());

  function releasePointers(sendUps = true) {
    for (const [id, button] of pointers) {
      if (sendUps) send({t:'button',b:button,down:false});
      pointers.delete(id);
      if (canvas.hasPointerCapture(id)) canvas.releasePointerCapture(id);
    }
  }
  function letGo() {
    for (const key of new Set(held.values())) send({t:'key',key,down:false});
    held.clear(); releasePointers();
  }
  addEventListener('blur', letGo);
  document.addEventListener('visibilitychange', () => { if (document.hidden) letGo(); });
  function drive(taking) {
    if (!connected) return;
    if (!taking) { letGo(); navigator.keyboard?.unlock?.(); }
    driving = taking; send({t:'control',take:taking}); render();
    if (taking) {
      canvas.focus();
      if (!hinted) { say('Ctrl+Alt+V pastes from your computer. Ctrl+Alt+Shift gives control back.'); hinted = true; }
    } else { canvas.blur(); say('The screen is the agent’s'); }
  }
  control.addEventListener('click', () => { if (!control.disabled) drive(true); });
  back.addEventListener('click', () => drive(false));
  function pasteText(text) {
    if (!driving) return;
    if (new TextEncoder().encode(text).length > 1048576) { say('Paste exceeds 1 MiB',true); return; }
    send({t:'paste',text}); canvas.focus();
  }
  async function pasteFromHost() {
    if (!driving) return;
    try { pasteText(await navigator.clipboard.readText()); }
    catch { say('Your browser did not share the clipboard.',true); canvas.focus(); }
  }
  paste.addEventListener('click',pasteFromHost);
  canvas.addEventListener('paste', event => { if (driving) { event.preventDefault(); pasteText(event.clipboardData.getData('text/plain')); } });
  const settings = $('settings'), settingsToggle = $('settings-toggle');
  function closeSettings() { settings.hidden = true; settingsToggle.setAttribute('aria-expanded','false'); }
  settingsToggle.addEventListener('click', () => { settings.hidden = !settings.hidden; settingsToggle.setAttribute('aria-expanded',String(!settings.hidden)); });
  $('cmd-control').hidden = !mac;
  $('cmd-control').addEventListener('click', () => { letGo(); cmdAsCtrl = !cmdAsCtrl; $('cmd-control').setAttribute('aria-pressed',String(cmdAsCtrl)); });
  async function fullscreen() {
    try {
      if (document.fullscreenElement) { await document.exitFullscreen(); return; }
      await document.documentElement.requestFullscreen();
      if (navigator.keyboard?.lock) { try { await navigator.keyboard.lock(); } catch { /* Some browsers reserve their own shortcuts. */ } }
      if (driving) canvas.focus();
    } catch { say('Your browser could not enter fullscreen.',true); }
    closeSettings();
  }
  $('fullscreen').addEventListener('click',fullscreen); $('settings-fullscreen').addEventListener('click',fullscreen);
  document.addEventListener('fullscreenchange', () => { if (!document.fullscreenElement) navigator.keyboard?.unlock?.(); fit(); });

  const files = $('files'), filesList = $('files-list'), filesUp = $('files-up');
  let folder = '', home = '', loadingFolder = null, listingSequence = 0, uploadQueue = Promise.resolve();
  function fileUrl(route,path) { return `${route}?token=${encodeURIComponent(token)}&path=${encodeURIComponent(path)}`; }
  function fileError(status) {
    if (status === 401) return 'This link cannot access files. Open it again from Hotline.';
    if (status === 403) return 'That file is outside the shared home.';
    if (status === 404) return 'That file or folder is no longer here.';
    if (status === 413) return 'That file is too large. The limit is 50 MiB.';
    if (status === 409) return 'A file with that name already exists.';
    return 'The computer could not finish the file request. Try again.';
  }
  function openFiles() { files.hidden = false; browse.setAttribute('aria-expanded','true'); closeSettings(); }
  function closeFiles() { files.hidden = true; browse.setAttribute('aria-expanded','false'); if (driving) canvas.focus(); else browse.focus(); }
  function sizeText(bytes) {
    if (bytes < 1024) return bytes + ' B';
    const units = ['KiB','MiB','GiB']; let value = bytes / 1024, unit = 0;
    while (value >= 1024 && unit < 2) { value /= 1024; unit++; }
    return (value < 10 ? value.toFixed(1) : Math.round(value)) + ' ' + units[unit];
  }
  function downloadIcon() {
    const wrapper = document.createElement('span'); wrapper.className = 'download'; wrapper.setAttribute('aria-hidden','true');
    wrapper.innerHTML = '<svg viewBox="0 0 16 16"><path d="M8 2v8m-3-3 3 3 3-3M3 11v3h10v-3"/></svg>';
    return wrapper;
  }
  async function showFolder(path) {
    openFiles();
    const sequence = ++listingSequence;
    try {
      const response = await fetch(fileUrl('/files',path));
      if (!response.ok) throw new Error(fileError(response.status));
      const listing = await response.json();
      if (sequence !== listingSequence) return false;
      folder = listing.path; home = listing.home;
      $('files-path').textContent = folder === home ? '~' : '~' + folder.slice(home.length); $('files-path').title = folder;
      filesUp.disabled = folder === home; filesList.replaceChildren();
      if (!listing.entries.length) { const empty = document.createElement('li'); empty.className = 'empty'; empty.textContent = 'Nothing here'; filesList.append(empty); }
      for (const entry of listing.entries) {
        const li = document.createElement('li'), button = document.createElement('button'), name = document.createElement('span'), details = document.createElement('span');
        button.className = 'file-row ' + (entry.is_dir ? 'dir' : 'file');
        button.setAttribute('aria-label',(entry.is_dir ? 'Open ' : 'Download ') + entry.name);
        name.className = 'name'; name.textContent = entry.name; details.className = 'details';
        const date = entry.modified ? new Date(entry.modified * 1000).toLocaleDateString() : '';
        details.textContent = (entry.is_dir ? '' : sizeText(entry.size) + ' · ') + date;
        button.append(name,details); if (!entry.is_dir) button.append(downloadIcon());
        const target = folder.replace(/\/$/,'') + '/' + entry.name;
        button.addEventListener('click', () => entry.is_dir ? showFolder(target) : saveFile(target,entry.name));
        li.append(button); filesList.append(li);
      }
      return true;
    } catch (error) { say(error instanceof TypeError ? 'Files are unavailable while the computer is disconnected.' : error.message,true); return false; }
  }
  async function ensureFolder() {
    openFiles();
    if (folder) return true;
    if (!loadingFolder) loadingFolder = showFolder('').finally(() => { loadingFolder = null; });
    return loadingFolder;
  }
  async function saveFile(path,name) {
    try {
      const response = await fetch(fileUrl('/files/download',path));
      if (!response.ok) throw new Error(fileError(response.status));
      const url = URL.createObjectURL(await response.blob()), link = document.createElement('a');
      link.href = url; link.download = name; document.body.append(link); link.click(); link.remove(); setTimeout(() => URL.revokeObjectURL(url),1000);
      say('Saving ' + name);
    } catch (error) { say(error instanceof TypeError ? 'The download was interrupted. Try again.' : error.message,true); }
  }
  function upload(file,path,createOnly,progress) {
    return new Promise((resolve,reject) => {
      const request = new XMLHttpRequest(); request.open('POST',fileUrl('/files',path) + (createOnly ? '&create_only=true' : ''));
      request.upload.onprogress = event => { if (event.lengthComputable) progress(Math.round(event.loaded / event.total * 100)); };
      request.onload = () => resolve(request.status);
      request.onerror = request.onabort = () => reject(new Error('The upload was interrupted. Try again.'));
      request.send(file);
    });
  }
  async function sendFiles(list) {
    if (!list.length || !await ensureFolder()) return;
    const destination = folder;
    filesList.querySelector('.empty')?.remove();
    for (const file of list) {
      const row = document.createElement('li'), name = document.createElement('span'), percentage = document.createElement('span'), progress = document.createElement('div'), fill = document.createElement('span');
      row.className = 'upload'; name.className = 'name'; name.textContent = file.name; percentage.textContent = '0%';
      progress.className = 'progress'; progress.setAttribute('role','progressbar'); progress.setAttribute('aria-label','Uploading ' + file.name); progress.setAttribute('aria-valuemin','0'); progress.setAttribute('aria-valuemax','100');
      progress.append(fill); row.append(name,percentage,progress); filesList.append(row);
      const update = value => { percentage.textContent = value + '%'; fill.style.width = value + '%'; progress.setAttribute('aria-valuenow',String(value)); };
      try {
        const path = destination.replace(/\/$/,'') + '/' + file.name;
        let code = await upload(file,path,true,update);
        if (code === 409) {
          if (!confirm(`Replace ${file.name}?`)) { percentage.textContent = 'Kept existing'; continue; }
          update(0); code = await upload(file,path,false,update);
        }
        if (code < 200 || code >= 300) throw new Error(fileError(code));
        update(100); say('Sent ' + file.name);
      } catch (error) { percentage.textContent = 'Failed'; say(error.message,true); }
    }
    if (!files.hidden) await showFolder(folder);
  }
  function queueFiles(list) { uploadQueue = uploadQueue.then(() => sendFiles(list)).catch(() => say('The upload could not finish. Try again.',true)); }
  browse.addEventListener('click', () => files.hidden ? showFolder(folder) : closeFiles());
  $('files-close').addEventListener('click',closeFiles); $('files-add').addEventListener('click', () => $('files-pick').click());
  $('files-pick').addEventListener('change', () => { queueFiles([...$('files-pick').files]); $('files-pick').value = ''; });
  filesUp.addEventListener('click', () => { if (folder !== home) showFolder(folder.replace(/\/[^/]*$/,'') || '/'); });
  addEventListener('dragover', event => {
    event.preventDefault();
    if ([...(event.dataTransfer?.types || [])].includes('Files')) { ensureFolder(); files.classList.add('arriving'); }
  });
  addEventListener('dragleave', event => { if (!event.relatedTarget) files.classList.remove('arriving'); });
  addEventListener('drop', event => { event.preventDefault(); files.classList.remove('arriving'); queueFiles([...event.dataTransfer.files]); });

  function at(event) {
    const rect = canvas.getBoundingClientRect();
    return { x:Math.max(0,Math.min(canvas.width-1,Math.round((event.clientX-rect.left)*canvas.width/rect.width))), y:Math.max(0,Math.min(canvas.height-1,Math.round((event.clientY-rect.top)*canvas.height/rect.height))) };
  }
  let pending = null, pointerFrame = null;
  canvas.addEventListener('pointermove', event => {
    if (!driving) return;
    pending = at(event);
    if (!pointerFrame) pointerFrame = requestAnimationFrame(() => { pointerFrame = null; if (pending && driving) send({t:'move',...pending}); pending = null; });
  });
  const buttons = {0:1,1:2,2:3};
  canvas.addEventListener('pointerdown', event => {
    if (!driving || pointers.size || !(event.button in buttons)) return;
    event.preventDefault(); canvas.focus(); pending = null;
    canvas.setPointerCapture(event.pointerId); pointers.set(event.pointerId,buttons[event.button]);
    send({t:'move',...at(event)}); send({t:'button',b:buttons[event.button],down:true});
  });
  function releasePointer(event) {
    if (!pointers.has(event.pointerId)) return;
    const button = pointers.get(event.pointerId); pointers.delete(event.pointerId);
    if (driving) send({t:'button',b:button,down:false});
    if (canvas.hasPointerCapture(event.pointerId)) canvas.releasePointerCapture(event.pointerId);
  }
  for (const kind of ['pointerup','pointercancel','lostpointercapture']) canvas.addEventListener(kind,releasePointer);
  canvas.addEventListener('contextmenu', event => event.preventDefault());
  let wheelX = 0, wheelY = 0;
  canvas.addEventListener('wheel', event => {
    if (!driving) return;
    event.preventDefault(); const unit = event.deltaMode === 1 ? 50 : event.deltaMode === 2 ? canvas.height : 1;
    wheelX += event.deltaX * unit; wheelY += event.deltaY * unit;
    while (Math.abs(wheelY) >= 50) { send({t:'wheel',dy:Math.sign(wheelY)}); wheelY -= Math.sign(wheelY)*50; }
    while (Math.abs(wheelX) >= 50) { send({t:'wheel',dx:Math.sign(wheelX)}); wheelX -= Math.sign(wheelX)*50; }
  },{passive:false});
  addEventListener('keydown', event => {
    if (driving && event.ctrlKey && event.altKey && event.shiftKey) { event.preventDefault(); event.stopImmediatePropagation(); drive(false); }
    if (event.key === 'Escape' && document.activeElement !== canvas) { if (!files.hidden) closeFiles(); closeSettings(); }
  },true);
  function hostPaste(event) { return (event.ctrlKey || event.metaKey) && event.altKey && event.code === 'KeyV'; }
  canvas.addEventListener('keydown', event => {
    if (!driving) return;
    event.preventDefault();
    if (hostPaste(event)) { if (!event.repeat) pasteFromHost(); return; }
    if (!event.repeat) {
      const key = mac && cmdAsCtrl && event.key === 'Meta' ? 'Control' : event.key;
      const code = event.code || event.key;
      const already = [...held.values()].includes(key); held.set(code,key);
      if (!already) send({t:'key',key,down:true});
    }
  });
  canvas.addEventListener('keyup', event => {
    if (!driving) return;
    event.preventDefault(); const code = event.code || event.key, key = held.get(code); held.delete(code);
    if (key && ![...held.values()].includes(key)) send({t:'key',key,down:false});
  });
  canvas.addEventListener('focus',render); canvas.addEventListener('blur', () => { letGo(); render(); });
  render(); connect();
})();
</script>
</body>
</html>
