<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Toad Computer</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; font: 13px system-ui, sans-serif; color: #9a9a9a; }
  canvas { display: block; outline: none; cursor: default; image-rendering: auto; }
  #status { position: fixed; top: 10px; left: 10px; padding: 4px 9px; border-radius: 999px; background: rgba(22,22,22,.92); border: 1px solid #2c2c2c; pointer-events: none; transition: opacity .3s; }
  #status.quiet { opacity: 0; }
  #control { position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%); padding: 6px 14px; border-radius: 999px; background: rgba(22,22,22,.92); border: 1px solid #2c2c2c; color: #d6d6d6; font: inherit; cursor: pointer; transition: opacity .3s; }
  #control:hover, #control:focus-visible { opacity: 1; color: #fff; border-color: #414141; }
  /* While the screen is the person's, the button sits over a desktop they
     are using, so it steps back to the edge of sight until they go for it. */
  #control.driving { opacity: .35; }
  #paste { position:fixed; bottom:14px; right:14px; padding:6px 14px; border-radius:6px; background:#161616; color:#ddd; border:1px solid #414141; font:inherit; cursor:pointer; }
  #paste:disabled { opacity:.35; cursor:default; }
</style>
</head>
<body>
<canvas id="screen" tabindex="0" width="1" height="1"></canvas>
<div id="status">Connecting…</div>
<button id="control" type="button">Take control</button>
<button id="paste" type="button" disabled>Paste clipboard</button>
<script>
(() => {
  const canvas = document.getElementById("screen");
  const status = document.getElementById("status");
  const control = document.getElementById("control");
  const paste = document.getElementById("paste");
  const context = canvas.getContext("2d");
  const token = decodeURIComponent(location.hash.slice(1));
  let socket = null;
  let drawing = Promise.resolve();
  let quiet = null;
  // The page opens watching. Nothing it does reaches the desktop until the
  // person takes the screen, so opening it never takes it from the agent.
  let driving = false;

  function say(text, fade) {
    status.textContent = text;
    status.classList.remove("quiet");
    clearTimeout(quiet);
    if (fade) quiet = setTimeout(() => status.classList.add("quiet"), 1200);
  }

  function fit() {
    const scale = Math.min(innerWidth / canvas.width, innerHeight / canvas.height);
    canvas.style.width = Math.floor(canvas.width * scale) + "px";
    canvas.style.height = Math.floor(canvas.height * scale) + "px";
  }
  addEventListener("resize", fit);

  function connect() {
    const scheme = location.protocol === "https:" ? "wss" : "ws";
    socket = new WebSocket(`${scheme}://${location.host}/ws?token=${encodeURIComponent(token)}`);
    socket.binaryType = "arraybuffer";
    // A fresh socket is a machine that has not been told who is driving, so
    // a person who still holds the screen says so again.
    socket.onopen = () => { say("Connected", true); if (driving) send({ t: "control", take: true }); };
    socket.onclose = () => { driving = false; paste.disabled = true; control.textContent = "Take control"; control.classList.remove("driving"); say("Reconnecting…"); setTimeout(connect, 1000); };
    socket.onmessage = (event) => {
      if (typeof event.data === 'string') {
        const message = JSON.parse(event.data);
        if (message.t === 'paste') say('Pasted', true);
        if (message.t === 'error') {
          say(message.error, false);
          if (!message.driving) { driving=false; paste.disabled=true; control.textContent='Take control'; control.classList.remove('driving'); }
        }
        return;
      }
      const data = event.data;
      const view = new DataView(data);
      const [x, y, w, h, sw, sh] = [0, 2, 4, 6, 8, 10].map((offset) => view.getUint16(offset, true));
      if (canvas.width !== sw || canvas.height !== sh) { canvas.width = sw; canvas.height = sh; fit(); }
      const blob = new Blob([data.slice(12)], { type: "image/png" });
      drawing = drawing
        .then(() => createImageBitmap(blob))
        .then((bitmap) => { context.drawImage(bitmap, x, y); bitmap.close(); })
        .catch(() => {});
    };
  }

  function send(message) {
    if (socket && socket.readyState === WebSocket.OPEN) socket.send(JSON.stringify(message));
  }

  function drive(taking) {
    driving = taking;
    paste.disabled = !taking;
    send({ t: "control", take: taking });
    control.textContent = taking ? "Give it back" : "Take control";
    control.classList.toggle("driving", taking);
    if (taking) canvas.focus(); else canvas.blur();
    say(taking ? "The screen is yours" : "The screen is the agent's", true);
  }
  control.addEventListener("click", () => drive(!driving));

  function pasteText(text) {
    if (!driving || !socket || socket.readyState !== WebSocket.OPEN) return;
    if (new TextEncoder().encode(text).length > 1048576) { say('Paste exceeds 1 MiB', false); return; }
    send({t:'paste',text});
    canvas.focus();
  }
  paste.addEventListener('click', async () => {
    if (!driving) return;
    try { pasteText(await navigator.clipboard.readText()); }
    catch { say('Clipboard access unavailable. Click the desktop and press ⌘V or Ctrl+V.', false); canvas.focus(); }
  });
  canvas.addEventListener('paste', event => {
    if (!driving) return;
    event.preventDefault();
    pasteText(event.clipboardData.getData('text/plain'));
  });

  function at(event) {
    const rect = canvas.getBoundingClientRect();
    return {
      x: Math.max(0, Math.min(canvas.width - 1, Math.round((event.clientX - rect.left) * canvas.width / rect.width))),
      y: Math.max(0, Math.min(canvas.height - 1, Math.round((event.clientY - rect.top) * canvas.height / rect.height))),
    };
  }

  // One pointer position per animation frame is plenty for a human hand.
  let pending = null;
  canvas.addEventListener("pointermove", (event) => {
    if (!driving) return;
    pending = at(event);
    requestAnimationFrame(() => { if (pending) { send({ t: "move", ...pending }); pending = null; } });
  });
  const buttons = { 0: 1, 1: 2, 2: 3 };
  canvas.addEventListener("pointerdown", (event) => {
    if (!driving) return;
    canvas.focus();
    send({ t: "move", ...at(event) });
    if (event.button in buttons) send({ t: "button", b: buttons[event.button], down: true });
  });
  canvas.addEventListener("pointerup", (event) => {
    if (!driving) return;
    if (event.button in buttons) send({ t: "button", b: buttons[event.button], down: false });
  });
  canvas.addEventListener("contextmenu", (event) => event.preventDefault());

  // Wheel deltas arrive in pixels from a trackpad and in lines from a mouse;
  // either way one notch is sent per fifty pixels' worth.
  let wheelX = 0, wheelY = 0;
  canvas.addEventListener("wheel", (event) => {
    if (!driving) return;
    event.preventDefault();
    const unit = event.deltaMode === 1 ? 50 : 1;
    wheelX += event.deltaX * unit; wheelY += event.deltaY * unit;
    while (Math.abs(wheelY) >= 50) { send({ t: "wheel", dy: Math.sign(wheelY) }); wheelY -= Math.sign(wheelY) * 50; }
    while (Math.abs(wheelX) >= 50) { send({ t: "wheel", dx: Math.sign(wheelX) }); wheelX -= Math.sign(wheelX) * 50; }
  }, { passive: false });

  // The X server repeats a held key itself, so browser repeats are dropped.
  canvas.addEventListener("keydown", (event) => {
    if (!driving) return;
    if ((event.metaKey || event.ctrlKey) && event.key.toLowerCase() === 'v') return;
    event.preventDefault();
    if (!event.repeat) send({ t: "key", key: event.key, down: true });
  });
  canvas.addEventListener("keyup", (event) => {
    if (!driving) return;
    if ((event.metaKey || event.ctrlKey) && event.key.toLowerCase() === 'v') return;
    event.preventDefault();
    send({ t: "key", key: event.key, down: false });
  });
  canvas.addEventListener("blur", () => { if (driving) say("Click the screen to type", true); });

  connect();
})();
</script>
</body>
</html>
