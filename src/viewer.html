<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hotline Computer</title>
<style>
  :root {
    --fill: rgba(28, 28, 31, .92); --raised: #343439; --rule: #38383d;
    --ink: #e8e8ea; --ink-2: #aaaaae; --muted: #7d7d82;
    --you: #7fc4f0; --warn: #f0c27a; --shadow: 0 8px 24px rgba(0, 0, 0, .55);
  }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; font: 13px system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--ink-2); }
  canvas { display: block; outline: none; cursor: default; image-rendering: auto; }
  /* One bar says whose screen this is and offers only what that allows. */
  #bar { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); display: inline-flex; align-items: center; gap: 4px; height: 40px; padding: 4px 6px 4px 12px; border-radius: 999px; background: var(--fill); border: 1px solid var(--rule); box-shadow: var(--shadow); white-space: nowrap; backdrop-filter: blur(8px); transition: opacity .3s; }
  #bar .status { display: inline-flex; align-items: center; gap: 8px; padding-right: 10px; margin-right: 4px; border-right: 1px solid var(--rule); color: var(--ink-2); }
  #bar .status .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
  #bar .sub { color: var(--muted); }
  #bar.driving .status { color: var(--you); }
  #bar.driving .status .dot { background: var(--you); box-shadow: 0 0 0 3px rgba(127, 196, 240, .2); }
  #bar.held .status .dot { background: var(--warn); }
  #bar.lost .status .dot { background: transparent; border: 1.5px solid var(--muted); }
  #bar button { border: 0; font: inherit; height: 30px; padding: 0 12px; border-radius: 999px; background: transparent; color: var(--ink); cursor: pointer; }
  #bar button.primary { background: var(--ink); color: #0d0d0f; font-weight: 600; }
  #bar button.quiet { color: var(--ink-2); }
  #bar button.quiet:hover, #bar button.quiet:focus-visible { background: var(--raised); color: var(--ink); }
  #bar button[disabled] { opacity: .4; cursor: default; }
  #bar .hint { font: 11px ui-monospace, Menlo, monospace; color: var(--muted); padding: 0 8px 0 4px; }
  /* While the screen is the person's, the bar sits over a desktop they are
     using, so it steps back to the edge of sight until they go for it. */
  #bar.driving.idle { opacity: .4; }
  #bar.driving.idle:hover { opacity: 1; }
  /* The hands, drawn where the machine says they are. The screen stream
     carries no cursor, so this arrow is how a person watching sees the
     agent reach for things; it slides rather than jumps, and a press rings. */
  #pointer { position: fixed; left: 0; top: 0; width: 22px; height: 30px; pointer-events: none; opacity: 0; transition: transform .14s cubic-bezier(.2, .7, .2, 1), opacity .4s; will-change: transform; filter: drop-shadow(0 1px 2px rgba(0, 0, 0, .6)); z-index: 5; }
  #pointer.shown { opacity: 1; }
  .ring { position: fixed; left: 0; top: 0; width: 28px; height: 28px; margin: -14px 0 0 -14px; border-radius: 50%; border: 2px solid var(--you); pointer-events: none; z-index: 4; animation: ring .45s ease-out forwards; }
  .ring.right { border-color: var(--warn); }
  @keyframes ring { from { transform: scale(.3); opacity: .9; } to { transform: scale(1.4); opacity: 0; } }
  /* The Files panel: the home and what is under it, as the machine lists
     it. A folder opens; a file is saved on this computer. */
  #files { position: fixed; right: 18px; bottom: 70px; width: min(420px, calc(100vw - 36px)); max-height: min(60vh, 520px); display: flex; flex-direction: column; border-radius: 14px; background: var(--fill); border: 1px solid var(--rule); box-shadow: var(--shadow); backdrop-filter: blur(8px); overflow: hidden; z-index: 6; }
  #files[hidden] { display: none; }
  #files header { display: flex; align-items: center; gap: 4px; padding: 8px 8px 8px 14px; border-bottom: 1px solid var(--rule); }
  #files header .path { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font: 12px ui-monospace, Menlo, monospace; color: var(--ink); }
  #files header button { border: 0; font: inherit; width: 28px; height: 28px; border-radius: 999px; background: transparent; color: var(--ink-2); cursor: pointer; }
  #files header button:hover:not([disabled]) { background: var(--raised); color: var(--ink); }
  #files header button[disabled] { opacity: .3; cursor: default; }
  #files.arriving { outline: 2px dashed var(--you); outline-offset: -2px; }
  #files ul { list-style: none; margin: 0; padding: 6px 0; overflow-y: auto; }
  #files li { display: flex; align-items: center; gap: 10px; padding: 6px 14px; cursor: pointer; color: var(--ink); }
  #files li:hover { background: var(--raised); }
  #files li .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #files li.dir .name::after { content: "/"; color: var(--muted); }
  #files li .size { font: 11px ui-monospace, Menlo, monospace; color: var(--muted); }
  #files li.empty { color: var(--muted); cursor: default; }
  #files li.empty:hover { background: transparent; }
  #toast { position: fixed; left: 50%; bottom: 70px; transform: translateX(-50%); padding: 5px 12px; border-radius: 999px; background: var(--fill); border: 1px solid var(--rule); color: var(--ink-2); font-size: 12px; pointer-events: none; transition: opacity .3s; }
  #toast.quiet { opacity: 0; }
</style>
</head>
<body>
<canvas id="screen" tabindex="0" width="1" height="1"></canvas>
<svg id="pointer" viewBox="0 0 22 30" aria-hidden="true"><path d="M2.5 1.5 L2.5 23 L8.6 17.6 L19 15.4 Z" fill="#f4f4f6" stroke="#141416" stroke-width="1.6" stroke-linejoin="round"/></svg>
<div id="toast" class="quiet"></div>
<div id="files" hidden>
  <header><span class="path" id="files-path"></span><button id="files-add" type="button" title="Add a file from your computer">+</button><button id="files-up" type="button" title="Up a folder">↑</button><button id="files-close" type="button" title="Close">×</button></header>
  <input id="files-pick" type="file" multiple hidden>
  <ul id="files-list"></ul>
</div>
<div id="bar" class="lost">
  <span class="status"><span class="dot"></span><span id="status">Connecting…</span><span class="sub" id="sub"></span></span>
  <button id="control" type="button" class="primary" hidden>Take control</button>
  <button id="paste" type="button" class="quiet" hidden>Paste</button>
  <button id="browse" type="button" class="quiet" hidden>Files</button>
  <button id="back" type="button" class="quiet" hidden>Give it back</button>
  <span class="hint" id="hint" hidden></span>
</div>
<script>
(() => {
  const canvas = document.getElementById("screen");
  const context = canvas.getContext("2d");
  const bar = document.getElementById("bar");
  const status = document.getElementById("status");
  const sub = document.getElementById("sub");
  const control = document.getElementById("control");
  const paste = document.getElementById("paste");
  const back = document.getElementById("back");
  const browse = document.getElementById("browse");
  const hint = document.getElementById("hint");
  const toast = document.getElementById("toast");
  const token = decodeURIComponent(location.hash.slice(1));
  const mac = /Mac|iPhone|iPad/.test(navigator.platform);
  let socket = null;
  let drawing = Promise.resolve();
  let quiet = null;
  let connected = false;
  // The page opens watching. Nothing it does reaches the desktop until the
  // person takes the screen, so opening it never takes it from the agent.
  let driving = false;
  // What the machine last said about itself: who holds it and its jobs.
  let machine = { holder: "none", running: 0, completed: 0, failed: 0 };
  let sticky = false;
  // The hands' last known point in screen pixels, and when to stop showing them.
  const pointer = document.getElementById("pointer");
  let hands = null;
  let handsIdle = null;

  function placePointer() {
    if (!hands) return;
    const rect = canvas.getBoundingClientRect();
    const px = rect.left + hands.x * rect.width / canvas.width;
    const py = rect.top + hands.y * rect.height / canvas.height;
    pointer.style.transform = `translate(${px.toFixed(1)}px, ${py.toFixed(1)}px)`;
    return [px, py];
  }

  function showHands(message) {
    hands = { x: message.x, y: message.y };
    const at = placePointer();
    // A person driving has their own pointer over the screen already.
    pointer.classList.toggle("shown", !driving);
    if (message.button && message.down && !driving && at) {
      const ring = document.createElement("div");
      ring.className = "ring" + (message.button === 3 ? " right" : "");
      ring.style.left = at[0] + "px"; ring.style.top = at[1] + "px";
      document.body.appendChild(ring);
      ring.addEventListener("animationend", () => ring.remove());
    }
    clearTimeout(handsIdle);
    handsIdle = setTimeout(() => pointer.classList.remove("shown"), 4000);
  }

  function say(text, fade = true) {
    toast.textContent = text;
    toast.classList.remove("quiet");
    clearTimeout(quiet);
    sticky = !fade;
    if (fade) quiet = setTimeout(() => toast.classList.add("quiet"), 1200);
  }

  function render() {
    const held = machine.holder === "person" && !driving;
    if (driving) pointer.classList.remove("shown");
    bar.className = !connected ? "lost" : driving ? "driving" : held ? "held" : "";
    control.hidden = !connected || driving;
    control.disabled = held;
    paste.hidden = back.hidden = hint.hidden = !(connected && driving);
    browse.hidden = !connected;
    if (!connected) { status.textContent = "Reconnecting…"; sub.textContent = ""; return; }
    if (driving) { status.textContent = "You’re in control"; sub.textContent = ""; hint.textContent = (mac ? "⌥⌘V" : "Ctrl+Alt+V") + " pastes from your computer"; return; }
    if (held) { status.textContent = "Someone else has the screen"; sub.textContent = ""; return; }
    status.textContent = "Watching";
    // The same words as the desktop's bar.
    const { running, completed, failed } = machine;
    const jobs = failed ? `${failed} failed · ${running} running`
      : running ? `${running} running · ${completed} done`
      : completed ? `${completed} done` : "no jobs";
    const doing = machine.holder === "agent" ? "agent in control" : "agent at work";
    sub.textContent = `· ${doing} · ${jobs}`;
  }

  function fit() {
    const scale = Math.min(innerWidth / canvas.width, innerHeight / canvas.height);
    canvas.style.width = Math.floor(canvas.width * scale) + "px";
    canvas.style.height = Math.floor(canvas.height * scale) + "px";
  }
  addEventListener("resize", () => { fit(); placePointer(); });

  function connect() {
    const scheme = location.protocol === "https:" ? "wss" : "ws";
    socket = new WebSocket(`${scheme}://${location.host}/ws?token=${encodeURIComponent(token)}`);
    socket.binaryType = "arraybuffer";
    // A fresh socket is a machine that has not been told who is driving, so
    // a person who still holds the screen says so again.
    socket.onopen = () => { connected = true; render(); if (driving) send({ t: "control", take: true }); };
    socket.onclose = () => { connected = false; driving = false; render(); setTimeout(connect, 1000); };
    socket.onmessage = (event) => {
      if (typeof event.data === 'string') {
        const message = JSON.parse(event.data);
        if (message.t === 'state') { machine = message; render(); }
        if (message.t === 'pointer') showHands(message);
        if (message.t === 'paste') say('Pasted');
        if (message.t === 'error') {
          say(message.error, false);
          if (!message.driving) { driving = false; render(); }
        }
        return;
      }
      const data = event.data;
      const view = new DataView(data);
      const [x, y, w, h, sw, sh] = [0, 2, 4, 6, 8, 10].map((offset) => view.getUint16(offset, true));
      if (canvas.width !== sw || canvas.height !== sh) { canvas.width = sw; canvas.height = sh; fit(); }
      const blob = new Blob([data.slice(12)], { type: "image/png" });
      drawing = drawing
        .then(() => createImageBitmap(blob))
        .then((bitmap) => { context.drawImage(bitmap, x, y); bitmap.close(); })
        .catch(() => {});
    };
  }

  function send(message) {
    if (socket && socket.readyState === WebSocket.OPEN) socket.send(JSON.stringify(message));
  }

  // Keys this page has sent down and not yet up. A host shortcut can take
  // focus between the two, and a modifier left down turns every later key
  // into a chord, so losing focus lets go of all of them.
  const held = new Set();
  function letGo() {
    for (const key of held) send({ t: "key", key, down: false });
    held.clear();
  }
  addEventListener("blur", letGo);
  document.addEventListener("visibilitychange", () => { if (document.hidden) letGo(); });

  function drive(taking) {
    if (!taking) letGo();
    driving = taking;
    send({ t: "control", take: taking });
    render();
    if (taking) canvas.focus(); else canvas.blur();
    say(taking ? "The screen is yours" : "The screen is the agent’s");
    wake();
  }
  control.addEventListener("click", () => { if (!control.disabled) drive(true); });
  back.addEventListener("click", () => drive(false));

  // Driving and idle for two seconds, the bar steps back until the pointer moves.
  let idle = null;
  function wake() {
    bar.classList.remove("idle");
    clearTimeout(idle);
    if (driving) idle = setTimeout(() => bar.classList.add("idle"), 2000);
  }
  addEventListener("pointermove", wake);

  function pasteText(text) {
    if (!driving || !socket || socket.readyState !== WebSocket.OPEN) return;
    if (new TextEncoder().encode(text).length > 1048576) { say('Paste exceeds 1 MiB', false); return; }
    send({t:'paste',text});
    canvas.focus();
  }
  paste.addEventListener('click', async () => {
    if (!driving) return;
    try { pasteText(await navigator.clipboard.readText()); }
    catch { say('Your browser did not share the clipboard.', false); canvas.focus(); }
  });
  // The machine has its own clipboard: Ctrl+V, Ctrl+C and Ctrl+Shift+V reach
  // it like any other key. Text from this computer comes in on Ctrl+Alt+V
  // (⌥⌘V on a Mac), or the Paste button.
  function hostPaste(event) {
    return (event.ctrlKey || event.metaKey) && event.altKey && event.code === 'KeyV';
  }
  canvas.addEventListener('paste', event => {
    if (!driving) return;
    event.preventDefault();
    pasteText(event.clipboardData.getData('text/plain'));
  });

  // The Files panel: the home and what is under it, as the machine lists
  // it. A folder opens, the arrow goes up as far as the home, and a file is
  // saved on this computer by the page's own browser. Reading takes nothing
  // from the agent, so watching is enough to look.
  const files = document.getElementById("files");
  const filesPath = document.getElementById("files-path");
  const filesUp = document.getElementById("files-up");
  const filesList = document.getElementById("files-list");
  let folder = "";
  let home = "";
  function fileUrl(route, path) {
    return `${route}?token=${encodeURIComponent(token)}&path=${encodeURIComponent(path)}`;
  }
  function sizeText(bytes) {
    if (bytes < 1024) return bytes + " B";
    const units = ["KiB", "MiB", "GiB"];
    let value = bytes / 1024, unit = 0;
    while (value >= 1024 && unit < units.length - 1) { value /= 1024; unit += 1; }
    return (value < 10 ? value.toFixed(1) : Math.round(value)) + " " + units[unit];
  }
  async function showFolder(path) {
    let listing;
    try {
      const response = await fetch(fileUrl("/files", path));
      listing = await response.json();
      if (!response.ok) throw new Error(listing.error || response.statusText);
    } catch (error) { say(error.message || String(error), false); return; }
    folder = listing.path; home = listing.home;
    filesPath.textContent = folder === home ? "~" : "~" + folder.slice(home.length);
    filesPath.title = folder;
    filesUp.disabled = folder === home;
    filesList.replaceChildren();
    if (!listing.entries.length) {
      const empty = document.createElement("li");
      empty.className = "empty"; empty.textContent = "Nothing here";
      filesList.appendChild(empty);
    }
    for (const entry of listing.entries) {
      const item = document.createElement("li");
      item.className = entry.is_dir ? "dir" : "file";
      const name = document.createElement("span");
      name.className = "name"; name.textContent = entry.name;
      item.appendChild(name);
      if (!entry.is_dir) {
        const size = document.createElement("span");
        size.className = "size"; size.textContent = sizeText(entry.size);
        item.appendChild(size);
      }
      item.addEventListener("click", () => {
        const path = folder.replace(/\/$/, "") + "/" + entry.name;
        if (entry.is_dir) showFolder(path); else saveFile(path, entry.name);
      });
      filesList.appendChild(item);
    }
    files.hidden = false;
  }
  function saveFile(path, name) {
    const link = document.createElement("a");
    link.href = fileUrl("/files/download", path); link.download = name;
    document.body.appendChild(link); link.click(); link.remove();
    say("Saving " + name);
  }
  // A file from this computer goes where the panel is looking: picked with
  // the + button, or dropped onto the panel.
  const filesAdd = document.getElementById("files-add");
  const filesPick = document.getElementById("files-pick");
  async function sendFiles(list) {
    for (const file of list) {
      say("Sending " + file.name + "…", false);
      try {
        const response = await fetch(fileUrl("/files", folder.replace(/\/$/, "") + "/" + file.name), { method: "POST", body: file });
        const reply = await response.json();
        if (!response.ok) throw new Error(reply.error || response.statusText);
        say("Sent " + file.name);
      } catch (error) { say(error.message || String(error), false); }
    }
    showFolder(folder);
  }
  filesAdd.addEventListener("click", () => filesPick.click());
  filesPick.addEventListener("change", () => { sendFiles([...filesPick.files]); filesPick.value = ""; });
  files.addEventListener("dragover", (event) => { event.preventDefault(); files.classList.add("arriving"); });
  files.addEventListener("dragleave", () => files.classList.remove("arriving"));
  files.addEventListener("drop", (event) => {
    event.preventDefault(); files.classList.remove("arriving");
    sendFiles([...event.dataTransfer.files]);
  });
  function closeFiles() { files.hidden = true; if (driving) canvas.focus(); }
  browse.addEventListener("click", () => { if (files.hidden) showFolder(folder); else closeFiles(); });
  document.getElementById("files-close").addEventListener("click", closeFiles);
  filesUp.addEventListener("click", () => { if (folder !== home) showFolder(folder.replace(/\/[^/]*$/, "") || "/"); });
  addEventListener("keydown", (event) => {
    if (event.key === "Escape" && !files.hidden && document.activeElement !== canvas) closeFiles();
  });

  function at(event) {
    const rect = canvas.getBoundingClientRect();
    return {
      x: Math.max(0, Math.min(canvas.width - 1, Math.round((event.clientX - rect.left) * canvas.width / rect.width))),
      y: Math.max(0, Math.min(canvas.height - 1, Math.round((event.clientY - rect.top) * canvas.height / rect.height))),
    };
  }

  // One pointer position per animation frame is plenty for a human hand.
  let pending = null;
  canvas.addEventListener("pointermove", (event) => {
    if (!driving) return;
    pending = at(event);
    requestAnimationFrame(() => { if (pending) { send({ t: "move", ...pending }); pending = null; } });
  });
  const buttons = { 0: 1, 1: 2, 2: 3 };
  canvas.addEventListener("pointerdown", (event) => {
    if (!driving) return;
    canvas.focus();
    send({ t: "move", ...at(event) });
    if (event.button in buttons) send({ t: "button", b: buttons[event.button], down: true });
  });
  canvas.addEventListener("pointerup", (event) => {
    if (!driving) return;
    if (event.button in buttons) send({ t: "button", b: buttons[event.button], down: false });
  });
  canvas.addEventListener("contextmenu", (event) => event.preventDefault());

  // Wheel deltas arrive in pixels from a trackpad and in lines from a mouse;
  // either way one notch is sent per fifty pixels' worth.
  let wheelX = 0, wheelY = 0;
  canvas.addEventListener("wheel", (event) => {
    if (!driving) return;
    event.preventDefault();
    const unit = event.deltaMode === 1 ? 50 : 1;
    wheelX += event.deltaX * unit; wheelY += event.deltaY * unit;
    while (Math.abs(wheelY) >= 50) { send({ t: "wheel", dy: Math.sign(wheelY) }); wheelY -= Math.sign(wheelY) * 50; }
    while (Math.abs(wheelX) >= 50) { send({ t: "wheel", dx: Math.sign(wheelX) }); wheelX -= Math.sign(wheelX) * 50; }
  }, { passive: false });

  // The X server repeats a held key itself, so browser repeats are dropped.
  canvas.addEventListener("keydown", (event) => {
    if (!driving) return;
    event.preventDefault();
    if (hostPaste(event)) {
      if (event.repeat) return;
      navigator.clipboard.readText().then(pasteText).catch(() => say('Your browser did not share the clipboard.', false));
      return;
    }
    if (!event.repeat) { held.add(event.key); send({ t: "key", key: event.key, down: true }); }
  });
  canvas.addEventListener("keyup", (event) => {
    if (!driving) return;
    event.preventDefault();
    if (hostPaste(event)) return;
    held.delete(event.key);
    send({ t: "key", key: event.key, down: false });
  });
  canvas.addEventListener("blur", () => { letGo(); if (driving) say("Click the screen to type"); });

  render();
  connect();
})();
</script>
</body>
</html>
