<style>
@font-face { font-family: Geist; src: url('/assets/fonts/Geist-Regular.woff2') format('woff2'); font-weight: 400; font-display: swap; }
@font-face { font-family: Geist; src: url('/assets/fonts/Geist-Medium.woff2') format('woff2'); font-weight: 500; font-display: swap; }
@font-face { font-family: Geist; src: url('/assets/fonts/Geist-SemiBold.woff2') format('woff2'); font-weight: 600; font-display: swap; }
@font-face { font-family: 'Geist Mono'; src: url('/assets/fonts/GeistMono-Regular.woff2') format('woff2'); font-weight: 400; font-display: swap; }
:root {
  --ground:#0b0b0d; --bar:#111114; --bar-rule:#222227; --surface:#17171b;
  --raised:#1f1f25; --raised-edge:#2e2e35; --chip:#19191e; --chip-edge:#26262c; --rule:#2a2a30;
  --ink:#ececef; --ink-2:#b4b4ba; --pill-ink:#a2a2a9; --muted:#8e8e95;
  --agent:#8fb8ff; --you:#f0c27a; --ok:#86d69c; --fail:#ff8f80;
  --fill:rgba(23,23,27,.92); --shadow:0 18px 40px rgba(0,0,0,.5);
}
* { box-sizing:border-box; }
[hidden] { display:none !important; }
html { min-height:100%; background:var(--ground); }
body { margin:0; min-height:100vh; color:var(--ink); font:13px Geist,sans-serif; }
#stage { min-height:calc(100vh - 72px); display:flex; align-items:center; justify-content:center; }
body.native #stage { width:max-content; min-width:100%; padding-bottom:16px; }
canvas { display:block; touch-action:none; cursor:default; flex:none; }
button { border:0; font:inherit; font-weight:400; cursor:pointer; background:transparent; color:var(--ink); }
button:disabled { opacity:.45; cursor:default; }
button:focus-visible, canvas:focus-visible, #toast:focus-visible { outline:2px solid var(--agent); outline-offset:2px; }
button svg { width:16px; height:16px; flex:none; fill:none; stroke:currentColor; stroke-width:1.5; stroke-linecap:round; stroke-linejoin:round; }
.mark { display:block; width:16px; height:16px; flex:none; color:var(--ink); }
#placeholder { position:fixed; inset:0 0 72px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; padding:24px; text-align:center; color:var(--muted); }
#placeholder .mark { width:64px; height:64px; }
#placeholder p { max-width:380px; margin:0; line-height:1.6; }
#bar { position:fixed; z-index:10; left:50%; bottom:12px; transform:translateX(-50%); display:flex; align-items:center; gap:4px; height:48px; max-width:calc(100vw - 24px); padding:0 6px 0 12px; border-radius:14px; background:var(--fill); border:1px solid var(--raised-edge); box-shadow:var(--shadow); backdrop-filter:blur(8px); white-space:nowrap; }
#bar.driving { border-color:color-mix(in srgb,var(--you) 45%,transparent); }
#bar .status { display:flex; align-items:center; gap:8px; min-width:0; padding-right:10px; margin-right:2px; }
#bar .status.divided { border-right:1px solid var(--rule); }
#status { overflow:hidden; text-overflow:ellipsis; max-width:220px; }
.dot { width:7px; height:7px; border-radius:50%; background:var(--ok); flex:none; }
#bar.lost .dot { background:var(--muted); }
#bar.stalled .dot, #bar.held .dot, #bar.driving .dot { background:var(--you); }
#bar.driving #status { color:var(--you); }
.sub { color:var(--muted); }
#job-count.failed { color:var(--fail); }
#bar button { height:32px; padding:0 10px; border-radius:8px; flex:none; }
#bar button:hover:not(:disabled), #settings button:hover { background:var(--raised); }
#bar .icon { width:32px; padding:8px; }
#bar .primary, #bar .primary:hover:not(:disabled) { background:var(--you); color:var(--ground); font-weight:500; }
#bar #back { background:var(--chip-edge); }
#bar .quiet { color:var(--ink-2); }
#bar [aria-pressed=true] { background:var(--raised); color:var(--agent); }
#keys { position:fixed; bottom:66px; left:50%; transform:translateX(-50%); color:var(--muted); font-size:11px; pointer-events:none; z-index:10; }
#pointer { position:fixed; left:0; top:0; width:22px; height:30px; pointer-events:none; opacity:0; transition:transform .14s ease-out,opacity .25s; z-index:5; }
#pointer.shown, #intent.shown { opacity:1; }
#intent { position:fixed; display:flex; align-items:center; gap:6px; height:28px; max-width:calc(100vw - 16px); padding:0 10px 0 4px; border-radius:14px; background:var(--agent); color:var(--ground); font-size:12.5px; font-weight:500; pointer-events:none; opacity:0; transition:opacity .25s; z-index:5; }
#intent-initial { display:grid; place-items:center; width:20px; height:20px; border-radius:50%; background:rgba(11,11,13,.12); flex:none; }
#intent-label { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.ring { position:fixed; width:28px; height:28px; margin:-14px 0 0 -14px; border:2px solid var(--agent); border-radius:50%; pointer-events:none; z-index:4; animation:ring .45s ease-out forwards; }
.ring.right { border-color:var(--you); }
@keyframes ring { from { transform:scale(.3); opacity:.9; } to { transform:scale(1.4); opacity:0; } }
.sheet { position:fixed; right:12px; bottom:72px; border-radius:14px; background:var(--fill); border:1px solid var(--raised-edge); box-shadow:var(--shadow); backdrop-filter:blur(8px); z-index:20; }
#settings { padding:6px; width:220px; }
#settings button { display:flex; width:100%; align-items:center; justify-content:space-between; text-align:left; min-height:32px; padding:6px 10px; border-radius:8px; }
#settings [aria-pressed=true] .check { color:var(--agent); }
#settings [aria-pressed=false] .check { visibility:hidden; }
#files { width:min(440px,calc(100vw - 24px)); max-height:min(65vh,540px); display:flex; flex-direction:column; }
#files header { display:flex; align-items:center; gap:4px; padding:8px 8px 8px 14px; border-bottom:1px solid var(--rule); }
#files-path { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font:12px 'Geist Mono',monospace; }
#files header button { width:28px; height:28px; border-radius:8px; display:grid; place-items:center; }
#files header button:hover { background:var(--raised); }
#files.arriving { outline:2px dashed var(--agent); outline-offset:-2px; }
#files-list { list-style:none; margin:0; padding:6px; overflow-y:auto; }
#files-list li { position:relative; }
.file-row { display:flex; width:100%; gap:10px; align-items:center; text-align:left; padding:9px 8px; border-radius:8px; }
.file-row:hover { background:var(--raised); }
.file-row .name, .upload .name { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.file-row.dir .name::after { content:'/'; color:var(--muted); }
.file-row .details { color:var(--muted); text-align:right; font-size:11px; line-height:1.5; flex:none; }
.file-row .download { opacity:0; }
.file-row:hover .download, .file-row:focus-visible .download { opacity:1; }
.empty, .upload { color:var(--muted); padding:10px 8px; }
.upload { display:flex; gap:8px; position:relative; }
.progress { position:absolute; left:8px; right:8px; bottom:3px; height:2px; background:var(--chip-edge); }
.progress span { display:block; width:0; height:100%; background:var(--agent); }
#toast { position:fixed; z-index:40; left:50%; bottom:82px; transform:translateX(-50%); max-width:calc(100vw - 24px); padding:10px 14px; border-radius:8px; background:var(--surface); border:1px solid var(--raised-edge); box-shadow:var(--shadow); color:var(--ink-2); line-height:1.4; cursor:pointer; transition:opacity .2s; }
#toast.error { color:var(--fail); }
#toast.quiet { opacity:0; pointer-events:none; }
@media(max-width:600px), (hover:none) {
  #sub, .hint, #bar .secondary { display:none; }
  #bar { gap:2px; padding-left:8px; }
  #bar button { padding:0 8px; }
  #bar .status { gap:6px; padding-right:6px; margin-right:0; }
  #status { max-width:120px; }
  #bar .icon { padding:8px; }
  .file-row .download { opacity:1; }
}
@media(prefers-reduced-motion:reduce) { #pointer, #intent, #toast { transition:none; } .ring { animation:none; } }
</style>
</head>

<div id="stage"><canvas id="screen" tabindex="0" width="1" height="1" role="img" aria-label="Agent's desktop" hidden></canvas></div>

</section>
<div id="keys" hidden>keys → computer</div>
<div id="bar" class="lost">

	<mask id="status-pupils" maskUnits="userSpaceOnUse" x="0" y="0" width="64" height="64">
		<rect width="64" height="64" fill="#fff" />

		<rect x="38.5" y="28" width="11" height="4" rx="2" fill="#000" />

		<rect x="4" y="30" width="56" height="18" rx="6" />

  function openFiles() { files.hidden = false; browse.setAttribute('aria-expanded','true'); closeSettings(); }

  function downloadIcon() {
    const wrapper = document.createElement('span'); wrapper.className = 'download'; wrapper.setAttribute('aria-hidden','true');
    wrapper.innerHTML = '<svg viewBox="0 0 16 16"><path d="M8 2v8m-3-3 3 3 3-3M3 11v3h10v-3"/></svg>';

  }
  async function showFolder(path) {

      const response = await fetch(fileUrl('/files',path));
      if (!response.ok) throw new Error(fileError(response.status));
      const listing = await response.json();
      if (sequence !== listingSequence) return false;

      $('files-path').textContent = folder === home ? '~' : '~' + folder.slice(home.length); $('files-path').title = folder;
      filesUp.disabled = folder === home; filesList.replaceChildren();
      if (!listing.entries.length) { const empty = document.createElement('li'); empty.className = 'empty'; empty.textContent = 'Nothing here'; filesList.append(empty); }
      for (const entry of listing.entries) {
        const li = document.createElement('li'), button = document.createElement('button'), name = document.createElement('span'), details = document.createElement('span');
        button.className = 'file-row ' + (entry.is_dir ? 'dir' : 'file');
        button.setAttribute('aria-label',(entry.is_dir ? 'Open ' : 'Download ') + entry.name);

        const date = entry.modified ? new Date(entry.modified * 1000).toLocaleDateString() : '';

        button.append(name,details); if (!entry.is_dir) button.append(downloadIcon());

  }
  async function ensureFolder() {
    openFiles();

    if (!loadingFolder) loadingFolder = showFolder('').finally(() => { loadingFolder = null; });

  }

      row.className = 'upload'; name.className = 'name'; name.textContent = file.name; percentage.textContent = '0%';
      progress.className = 'progress'; progress.setAttribute('role','progressbar'); progress.setAttribute('aria-label','Uploading ' + file.name); progress.setAttribute('aria-valuemin','0'); progress.setAttribute('aria-valuemax','100');
      progress.append(fill); row.append(name,percentage,progress); filesList.append(row);

  addEventListener('dragover', event => {
