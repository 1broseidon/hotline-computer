<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Files</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2064%2064%22%20class%3D%22mark%22%20aria-hidden%3D%22true%22%3E%0A%09%0A%09%3Cmask%20id%3D%22hotline-pupils%22%20maskUnits%3D%22userSpaceOnUse%22%20x%3D%220%22%20y%3D%220%22%20width%3D%2264%22%20height%3D%2264%22%3E%0A%09%09%3Crect%20width%3D%2264%22%20height%3D%2264%22%20fill%3D%22%23fff%22%20/%3E%0A%09%09%3Crect%20x%3D%2214.5%22%20y%3D%2228%22%20width%3D%2211%22%20height%3D%224%22%20rx%3D%222%22%20fill%3D%22%23000%22%20/%3E%0A%09%09%3Crect%20x%3D%2238.5%22%20y%3D%2228%22%20width%3D%2211%22%20height%3D%224%22%20rx%3D%222%22%20fill%3D%22%23000%22%20/%3E%0A%09%3C/mask%3E%0A%09%3Cg%20mask%3D%22url%28%23hotline-pupils%29%22%20fill%3D%22%23ececef%22%3E%0A%09%09%3Crect%20x%3D%224%22%20y%3D%2230%22%20width%3D%2256%22%20height%3D%2218%22%20rx%3D%226%22%20/%3E%0A%09%09%3Ccircle%20cx%3D%2220%22%20cy%3D%2230%22%20r%3D%2210.5%22%20/%3E%0A%09%09%3Ccircle%20cx%3D%2244%22%20cy%3D%2230%22%20r%3D%2210.5%22%20/%3E%0A%09%3C/g%3E%0A%3C/svg%3E%0A">
<style>
@font-face { font-family: Geist; src: url('/assets/fonts/Geist-Regular.woff2') format('woff2'); font-weight: 400; font-display: swap; }
@font-face { font-family: Geist; src: url('/assets/fonts/Geist-Medium.woff2') format('woff2'); font-weight: 500; font-display: swap; }
@font-face { font-family: Geist; src: url('/assets/fonts/Geist-SemiBold.woff2') format('woff2'); font-weight: 600; font-display: swap; }
@font-face { font-family: 'Geist Mono'; src: url('/assets/fonts/GeistMono-Regular.woff2') format('woff2'); font-weight: 400; font-display: swap; }
:root {
  --ground:#0b0b0d; --bar:#111114; --bar-rule:#222227; --surface:#17171b;
  --raised:#1f1f25; --raised-edge:#2e2e35; --chip:#19191e; --chip-edge:#26262c; --rule:#2a2a30;
  --ink:#ececef; --ink-2:#b4b4ba; --pill-ink:#a2a2a9; --muted:#8e8e95;
  --agent:#8fb8ff; --you:#f0c27a; --ok:#86d69c; --fail:#ff8f80;
  --shadow:0 18px 40px rgba(0,0,0,.5);
  --selected:color-mix(in srgb, var(--agent) 16%, var(--surface));
  color-scheme:dark;
}
* { box-sizing:border-box; }
[hidden] { display:none !important; }
html, body { height:100%; margin:0; background:var(--surface); }
body { display:flex; overflow:hidden; color:var(--ink); font:13px Geist,sans-serif; }
button, input, select { font:inherit; color:inherit; }
button { border:0; background:transparent; cursor:pointer; font-weight:400; }
button:disabled { opacity:.45; cursor:default; }
:focus-visible { outline:2px solid var(--agent); outline-offset:2px; }
.i { width:16px; height:16px; flex:none; fill:none; stroke:currentColor; stroke-width:1.5; stroke-linecap:round; stroke-linejoin:round; }
.mark { display:block; width:16px; height:16px; flex:none; color:var(--ink); }

#side { width:188px; flex:none; display:flex; flex-direction:column; gap:2px; padding:12px 8px; background:var(--bar); border-right:1px solid var(--bar-rule); }
#side h1 { display:flex; align-items:center; gap:8px; height:32px; margin:0 0 6px; padding:0 8px; font-size:13px; font-weight:600; }
#heading { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
#side h2 { margin:6px 8px 4px; font-size:11.5px; font-weight:500; color:var(--muted); }
#places { flex:1; min-height:0; overflow-y:auto; list-style:none; margin:0; padding:0; }
.place { display:flex; align-items:center; gap:10px; width:100%; height:32px; padding:0 8px; border-radius:8px; color:var(--ink-2); text-align:left; }
.place span { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.place:hover { background:var(--raised); color:var(--ink); }
.place[aria-current=true] { background:var(--raised); box-shadow:inset 0 0 0 1px var(--raised-edge); color:var(--ink); }
.toggle { display:flex; align-items:center; gap:8px; min-height:32px; padding:0 8px; border-radius:8px; color:var(--ink-2); cursor:pointer; }
.toggle:hover { color:var(--ink); }
.toggle input { margin:0; width:14px; height:14px; accent-color:var(--agent); }

main { flex:1; min-width:0; display:flex; flex-direction:column; }
#top { position:relative; flex:none; display:flex; align-items:center; gap:4px; height:52px; padding:0 12px 0 10px; border-bottom:1px solid var(--rule); }
.icon { display:grid; place-items:center; flex:none; width:32px; height:32px; border-radius:8px; color:var(--ink-2); }
.icon:hover:not(:disabled) { background:var(--raised); color:var(--ink); }
#pathbox { flex:1; min-width:0; display:flex; align-items:center; height:32px; margin-left:6px; padding-left:3px; border-radius:8px; background:var(--chip); border:1px solid var(--chip-edge); overflow:hidden; }
#pathbox.editing { border-color:var(--agent); padding-left:0; }
#crumbs { flex:0 1 auto; min-width:0; display:flex; align-items:center; justify-content:flex-end; overflow:hidden; }
.crumb { flex:0 1 auto; min-width:28px; max-width:180px; height:24px; padding:0 6px; border-radius:6px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--ink-2); }
.crumb:hover { background:var(--raised); color:var(--ink); }
.crumb[aria-current] { flex-shrink:0; color:var(--ink); font-weight:500; }
.crumb:focus-visible, #path-edit:focus-visible { outline-offset:-2px; }
.sep { flex:none; color:var(--muted); }
#path-edit { flex:1; align-self:stretch; min-width:24px; cursor:text; }
#path-input { flex:1; min-width:0; height:100%; padding:0 10px; border:0; background:transparent; outline:none; font:12px 'Geist Mono',monospace; }
#loading { position:absolute; left:0; right:0; bottom:-1px; height:2px; overflow:hidden; opacity:0; transition:opacity .15s; }
body.loading #loading { opacity:1; }
#loading::after { content:''; position:absolute; top:0; left:-30%; width:30%; height:100%; background:var(--agent); animation:slide 1.1s ease-in-out infinite; }
@keyframes slide { to { left:100%; } }

#wrap { position:relative; flex:1; min-height:0; display:flex; flex-direction:column; }
.cols { display:grid; grid-template-columns:minmax(0,1fr) 88px 136px; column-gap:12px; align-items:center; }
#head { flex:none; height:30px; padding:0 16px; overflow:hidden; scrollbar-gutter:stable; border-bottom:1px solid var(--rule); color:var(--muted); font-size:12px; }
.num { text-align:right; }
#list { flex:1; min-height:0; overflow-y:auto; scrollbar-gutter:stable; padding:6px; outline:none; user-select:none; }
#list:focus-visible:not([aria-activedescendant]) { outline:none; box-shadow:inset 0 0 0 1px color-mix(in srgb, var(--agent) 35%, transparent); }
.row { height:30px; padding:0 10px; border-radius:8px; color:var(--ink-2); cursor:default; }
.row:hover { background:var(--raised); }
.row[aria-selected=true] { background:var(--selected); color:var(--ink); }
#list.kbd:focus .row.cursor, #list:focus-visible .row.cursor { box-shadow:inset 0 0 0 2px var(--agent); }
.row[aria-disabled=true] { opacity:.4; }
.row[aria-disabled=true]:hover { background:none; }
.name { display:flex; align-items:center; gap:10px; min-width:0; color:var(--ink); }
.name > span { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.row .i { color:var(--muted); }
.row.dir .i { color:var(--ink-2); fill:color-mix(in srgb, var(--ink-2) 14%, transparent); }
.tag { flex:none; font-size:11px; color:var(--muted); }
.meta { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--muted); font-size:12px; font-variant-numeric:tabular-nums; }
#empty { position:absolute; top:76px; left:24px; right:24px; display:flex; flex-direction:column; align-items:center; gap:12px; color:var(--muted); text-align:center; line-height:1.6; pointer-events:none; }
#empty p { max-width:380px; margin:0; }
#empty.error p { color:var(--fail); }
#empty button { pointer-events:auto; }
.overlay { position:absolute; z-index:2; left:12px; right:12px; display:flex; align-items:center; gap:8px; padding:6px 6px 6px 14px; border-radius:8px; background:var(--raised); border:1px solid var(--raised-edge); box-shadow:var(--shadow); line-height:1.45; }
.overlay p { flex:1; min-width:0; margin:4px 0; }
#notice { top:40px; color:var(--fail); }
#notice.info { color:var(--ink-2); }
#confirm { bottom:10px; }

footer { flex:none; display:flex; flex-wrap:wrap; align-items:center; gap:8px; min-height:56px; padding:11px 12px; border-top:1px solid var(--rule); background:var(--bar); }
.btn { flex:none; height:32px; padding:0 14px; border-radius:8px; background:var(--chip); border:1px solid var(--chip-edge); white-space:nowrap; }
.btn:hover:not(:disabled) { background:var(--raised); border-color:var(--raised-edge); }
.btn.primary, .btn.primary:hover:not(:disabled) { background:var(--you); border-color:var(--you); color:var(--ground); font-weight:500; }
#status { flex:1 1 120px; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--muted); }
.field { display:flex; align-items:center; gap:8px; min-width:0; }
.field label { flex:none; color:var(--ink-2); }
#name-field { flex:1 1 220px; }
.text, select { height:32px; min-width:0; padding:0 10px; border-radius:8px; background:var(--chip); border:1px solid var(--chip-edge); }
.text { flex:1; }
select { max-width:210px; cursor:pointer; }
@media (max-width:760px) { #side { width:152px; } .cols { grid-template-columns:minmax(0,1fr) 76px 112px; } }
@media (max-width:660px) { .cols { grid-template-columns:minmax(0,1fr) 104px; } .size { display:none; } }
@media (prefers-reduced-motion:reduce) { #loading::after { animation:none; left:0; width:100%; opacity:.6; } #loading { transition:none; } }
</style>
</head>
<body>
<nav id="side" aria-label="Places">
  <h1><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" class="mark" aria-hidden="true">
    <mask id="side-pupils" maskUnits="userSpaceOnUse" x="0" y="0" width="64" height="64">
      <rect width="64" height="64" fill="#fff" />
      <rect x="14.5" y="28" width="11" height="4" rx="2" fill="#000" />
      <rect x="38.5" y="28" width="11" height="4" rx="2" fill="#000" />
    </mask>
    <g mask="url(#side-pupils)" fill="currentColor">
      <rect x="4" y="30" width="56" height="18" rx="6" />
      <circle cx="20" cy="30" r="10.5" />
      <circle cx="44" cy="30" r="10.5" />
    </g>
  </svg><span id="heading">Files</span></h1>
  <h2 id="places-label">Places</h2>
  <ul id="places" aria-labelledby="places-label"></ul>
  <label class="toggle"><input type="checkbox" id="show-hidden"> Show hidden files</label>
</nav>
<main>
  <div id="top">
    <button class="icon" id="back" type="button" aria-label="Back" title="Back (Alt+Left)" disabled><svg class="i" viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3 5 8l5 5"/></svg></button>
    <button class="icon" id="up" type="button" aria-label="Up a folder" title="Up a folder (Alt+Up)" disabled><svg class="i" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 13V3M3 8l5-5 5 5"/></svg></button>
    <div id="pathbox">
      <div id="crumbs" role="group" aria-label="Path"></div>
      <button id="path-edit" type="button" aria-label="Edit path" title="Type a path (Ctrl+L)"></button>
      <input id="path-input" type="text" aria-label="Path" spellcheck="false" autocomplete="off" hidden>
    </div>
    <div id="loading" aria-hidden="true"></div>
  </div>
  <div id="wrap">
    <div id="head" class="cols" aria-hidden="true"><span>Name</span><span class="num size">Size</span><span>Modified</span></div>
    <div id="list" role="listbox" tabindex="0" aria-label="Files"></div>
    <div id="empty" hidden><p id="empty-text"></p><button class="btn" id="retry" type="button" hidden>Try again</button></div>
    <div id="notice" class="overlay" role="alert" hidden><p id="notice-text"></p>
      <button class="icon" id="dismiss" type="button" aria-label="Dismiss message" title="Dismiss"><svg class="i" viewBox="0 0 16 16" aria-hidden="true"><path d="m4 4 8 8M12 4l-8 8"/></svg></button></div>
    <div id="confirm" class="overlay" role="group" aria-labelledby="confirm-text" hidden><p id="confirm-text"></p>
      <button class="btn" id="keep" type="button">Don't replace</button><button class="btn primary" id="replace" type="button">Replace</button></div>
  </div>
  <footer>
    <div class="field" id="name-field" hidden><label for="name">Name</label><input id="name" class="text" type="text" spellcheck="false" autocomplete="off"></div>
    <div class="field" id="filter-field" hidden><label for="filter">File type</label><select id="filter"></select></div>
    <div id="status" aria-live="polite"></div>
    <button class="btn" id="terminal" type="button" hidden>Open terminal here</button>
    <button class="btn" id="copy" type="button" hidden>Copy path</button>
    <button class="btn" id="cancel" type="button" hidden>Cancel</button>
    <button class="btn primary" id="accept" type="button" hidden disabled>Open</button>
  </footer>
</main>
<script>
(() => {
  'use strict';
  // One page, two jobs: the file manager (browse) and the system file dialog
  // other apps raise through the portal (pick). The key arrives in the fragment
  // so it never reaches a server log, and travels only as a header.
  const $ = id => document.getElementById(id);
  const HOME = '/home/agent', WORKSPACE = HOME + '/workspace';
  const params = new URLSearchParams(location.hash.slice(1));
  const key = params.get('key') || '', requestId = params.get('request');
  const reqUrl = requestId ? '/fm/request/' + encodeURIComponent(requestId) : null;
  const list = $('list'), nameInput = $('name'), accept = $('accept'), pathInput = $('path-input');
  const collator = new Intl.Collator(undefined, { numeric: true, sensitivity: 'base' });
  const hist = [];
  let mode = reqUrl ? 'open' : 'browse', req = null, cur = null, rows = [], sel = new Set();
  let cursor = -1, anchor = -1, seq = 0, busy = false, answered = false, loadTimer, retryPath = null;
  let activeFilter = null, patterns = [], typed = '', typedAt = 0, showHidden = false;
  try { showHidden = localStorage.getItem('files.hidden') === '1'; } catch {}

  const ICONS = {
    folder: '<path d="M2 4.5A1.5 1.5 0 0 1 3.5 3h2.4l1.5 1.5h5.1A1.5 1.5 0 0 1 14 6v5.5a1.5 1.5 0 0 1-1.5 1.5h-9A1.5 1.5 0 0 1 2 11.5z"/>',
    file: '<path d="M4.5 1.5H9l3 3v9.5a.5.5 0 0 1-.5.5h-7a.5.5 0 0 1-.5-.5V2a.5.5 0 0 1 .5-.5z"/><path d="M9 1.5v3h3"/>',
    home: '<path d="M2.5 7 8 2.5 13.5 7v6a.5.5 0 0 1-.5.5H3a.5.5 0 0 1-.5-.5z"/><path d="M6.5 13.5v-4h3v4"/>',
  };
  const icon = name => `<svg class="i" viewBox="0 0 16 16" aria-hidden="true">${ICONS[name]}</svg>`;
  const el = (tag, cls) => { const node = document.createElement(tag); if (cls) node.className = cls; return node; };

  // Paths and formatting
  const baseName = p => p === '/' ? '/' : p.slice(p.lastIndexOf('/') + 1);
  const dirName = p => { const i = p.lastIndexOf('/'); return i <= 0 ? '/' : p.slice(0, i); };
  const join = (dir, name) => (dir === '/' ? '' : dir) + '/' + name;
  const label = p => p === HOME ? 'Home' : baseName(p);
  function resolve(text) {
    let t = text.trim();
    if (!t) return null;
    if (t === '~' || t.startsWith('~/')) t = HOME + t.slice(1);
    else if (!t.startsWith('/')) t = join(cur ? cur.path : HOME, t);
    const out = [];
    for (const part of t.split('/')) { if (part === '..') out.pop(); else if (part && part !== '.') out.push(part); }
    return '/' + out.join('/');
  }
  function size(n) {
    if (n < 1000) return n === 1 ? '1 byte' : `${n} bytes`;
    const units = ['kB', 'MB', 'GB', 'TB']; let i = -1;
    do { n /= 1000; i++; } while (n >= 1000 && i < units.length - 1);
    return `${n < 10 ? n.toFixed(1) : Math.round(n)} ${units[i]}`;
  }
  const clock = d => d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hourCycle: 'h23' });
  function when(seconds) {
    if (!seconds) return '—';
    const d = new Date(seconds * 1000), now = new Date();
    const day = x => new Date(x.getFullYear(), x.getMonth(), x.getDate()).getTime();
    const days = Math.round((day(now) - day(d)) / 864e5);
    if (days === 0) return `Today ${clock(d)}`;
    if (days === 1) return `Yesterday ${clock(d)}`;
    const options = { day: 'numeric', month: 'short' };
    if (d.getFullYear() !== now.getFullYear()) options.year = 'numeric';
    return d.toLocaleDateString([], options);
  }
  // Filters are shell globs like *.png, matched without regard to case.
  // A filter with only MIME types can't be judged by name, so it shows everything.
  // Chromium writes `accept=".pdf"` as `*.[pP][dD][fF]`, so bracket classes count.
  function globs(filter) {
    const one = (pattern) => {
      let out = '';
      for (let i = 0; i < pattern.length; i++) {
        const c = pattern[i];
        if (c === '*') out += '.*';
        else if (c === '?') out += '.';
        else if (c === '[') {
          const end = pattern.indexOf(']', i + 2);
          if (end < 0) { out += '\\['; continue; }
          let body = pattern.slice(i + 1, end).replace(/\\/g, '\\\\');
          if (body[0] === '!') body = '^' + body.slice(1);
          out += '[' + body + ']'; i = end;
        } else out += c.replace(/[.+^${}()|\]\\]/g, '\\$&');
      }
      return new RegExp('^' + out + '$', 'i');
    };
    return (filter?.patterns || []).map(one);
  }
  const matches = e => e.dir || !patterns.length || patterns.some(r => r.test(e.name));
  function selectable(e) {
    if (mode === 'browse') return true;
    if (mode === 'open' && req.directory) return e.dir;
    return matches(e);
  }
  const multi = () => mode === 'browse' || (mode === 'open' && !!req.multiple);

  // Server
  async function api(method, url, body) {
    const init = { method, cache: 'no-store', headers: { 'X-Files-Key': key } };
    if (body !== undefined) { init.headers['Content-Type'] = 'application/json'; init.body = JSON.stringify(body); }
    let res;
    try { res = await fetch(url, init); } catch { throw new Error("The computer isn't answering. Try again in a moment."); }
    if (res.status === 204) return null;
    let data = null;
    try { data = await res.json(); } catch {}
    if (!res.ok) {
      if (data && typeof data.error === 'string') throw new Error(data.error);
      if (res.status === 401 || res.status === 403) throw new Error("This window's key isn't valid anymore. Open it again from the computer.");
      if (res.status === 404) throw new Error("That isn't there anymore.");
      throw new Error(`Something went wrong on the computer (${res.status}).`);
    }
    return data;
  }
  const fetchList = path => api('GET', '/fm/list?path=' + encodeURIComponent(path));

  // Messages and states
  function notice(text, info = false) { $('notice-text').textContent = text; $('notice').classList.toggle('info', info); $('notice').hidden = false; }
  const dismiss = () => { $('notice').hidden = true; };
  const setStatus = text => { $('status').textContent = text; };
  function showEmpty(text, error = false, retry = null) {
    $('empty').hidden = !text; $('empty').classList.toggle('error', error);
    $('empty-text').textContent = text || ''; retryPath = retry; $('retry').hidden = !retry;
  }
  function setLoading(on) {
    clearTimeout(loadTimer); list.setAttribute('aria-busy', String(on));
    if (on) loadTimer = setTimeout(() => document.body.classList.add('loading'), 150);
    else document.body.classList.remove('loading');
  }
  function hideConfirm() { $('confirm').hidden = true; }

  // Rendering
  function renderPlaces() {
    $('places').replaceChildren(...(cur.places || []).map(place => {
      const li = el('li'), button = el('button', 'place'), span = el('span');
      button.type = 'button'; button.innerHTML = icon(place.path === HOME ? 'home' : 'folder');
      span.textContent = place.name; button.append(span); button.title = place.path;
      if (place.path === cur.path) button.setAttribute('aria-current', 'true');
      button.addEventListener('click', () => go(place.path));
      li.append(button); return li;
    }));
  }
  function renderCrumbs() {
    const box = $('crumbs'), p = cur.path, parts = [];
    let at = '';
    if (p === HOME || p.startsWith(HOME + '/')) { parts.push(['Home', HOME]); at = HOME; } else parts.push(['/', '/']);
    for (const part of p.slice(at.length).split('/').filter(Boolean)) { at = (at === '/' ? '' : at) + '/' + part; parts.push([part, at]); }
    box.replaceChildren();
    parts.forEach(([name, path], i) => {
      if (i) { const sep = el('span', 'sep'); sep.textContent = '›'; sep.setAttribute('aria-hidden', 'true'); box.append(sep); }
      const button = el('button', 'crumb'); button.type = 'button'; button.textContent = name; button.title = path;
      if (i === parts.length - 1) button.setAttribute('aria-current', 'location');
      button.addEventListener('click', () => path === cur.path ? editPath() : go(path));
      box.append(button);
    });
  }
  function renderList() {
    const cursorPath = rows[cursor]?.path, anchorPath = rows[anchor]?.path;
    const all = cur.entries.slice().sort((a, b) => (b.dir - a.dir) || collator.compare(a.name, b.name));
    rows = all.filter(e => showHidden || !e.hidden);
    sel = new Set(rows.filter(e => sel.has(e.path) && selectable(e)).map(e => e.path));
    cursor = cursorPath ? rows.findIndex(e => e.path === cursorPath) : -1;
    anchor = anchorPath ? rows.findIndex(e => e.path === anchorPath) : -1;
    const frag = document.createDocumentFragment();
    rows.forEach((e, i) => {
      const row = el('div', 'row cols' + (e.dir ? ' dir' : ''));
      row.id = 'r' + i; row.dataset.i = i; row.setAttribute('role', 'option'); row.setAttribute('aria-label', e.name);
      row.setAttribute('aria-description', (e.link ? 'Link · ' : '') + (e.dir ? 'Folder' : `${size(e.size)} · modified ${when(e.modified)}`));
      if (!selectable(e)) row.setAttribute('aria-disabled', 'true');
      row.innerHTML = `<span class="name">${icon(e.dir ? 'folder' : 'file')}<span></span></span><span class="meta num size"></span><span class="meta"></span>`;
      const [name, bytes, date] = row.children;
      name.lastChild.textContent = e.name; name.lastChild.title = e.name;
      if (e.link) { const tag = el('span', 'tag'); tag.textContent = 'link'; name.append(tag); }
      bytes.textContent = e.dir ? '—' : size(e.size);
      date.textContent = when(e.modified);
      if (e.modified) date.title = new Date(e.modified * 1000).toLocaleString();
      frag.append(row);
    });
    list.replaceChildren(frag);
    const hiddenCount = all.length - rows.length;
    showEmpty(rows.length ? null : hiddenCount ? 'Only hidden files here. Press Ctrl+H to show them.' : 'This folder is empty.');
    updateSel();
  }
  function updateSel() {
    for (const row of list.children) {
      const i = +row.dataset.i;
      row.setAttribute('aria-selected', String(sel.has(rows[i].path)));
      row.classList.toggle('cursor', i === cursor);
    }
    if (cursor >= 0) list.setAttribute('aria-activedescendant', 'r' + cursor); else list.removeAttribute('aria-activedescendant');
    updateFooter();
  }
  function updateFooter() {
    const chosen = rows.filter(e => sel.has(e.path)), files = chosen.filter(e => !e.dir), dirs = chosen.filter(e => e.dir);
    if (mode === 'browse') {
      const bytes = files.reduce((n, e) => n + e.size, 0);
      if (chosen.length === 1) setStatus(`“${chosen[0].name}” selected` + (files.length ? ` · ${size(bytes)}` : ''));
      else if (chosen.length) setStatus(`${chosen.length} items selected` + (files.length ? ` · ${size(bytes)}` : ''));
      else setStatus(cur ? `${rows.length} ${rows.length === 1 ? 'item' : 'items'}` : '');
    } else if (mode === 'open' && req.directory) {
      accept.textContent = req.accept_label || (dirs.length ? 'Choose folder' : 'Choose this folder');
      accept.disabled = busy || !cur;
      setStatus(dirs.length > 1 ? `${dirs.length} folders selected` : cur ? `Will choose ${dirs[0]?.path || cur.path}` : '');
    } else if (mode === 'open') {
      accept.disabled = busy || !(files.length || dirs.length === 1);
      setStatus(files.length === 1 ? files[0].name : files.length ? `${files.length} files selected` : '');
    } else accept.disabled = busy || !cur || !nameInput.value.trim();
  }

  // Navigation
  function show(data, { push = true, select = null } = {}) {
    const same = cur && cur.path === data.path;
    if (push && cur && !same) hist.push(cur.path);
    if (!same) { sel = new Set(); cursor = anchor = -1; dismiss(); }
    cur = data; hideConfirm(); stopEdit();
    renderPlaces(); renderCrumbs(); renderList();
    if (select) {
      const i = rows.findIndex(e => e.name === select);
      if (i >= 0) { cursor = anchor = i; if (selectable(rows[i])) sel = new Set([rows[i].path]); updateSel(); }
    }
    if (!same) list.scrollTop = 0;
    $('r' + cursor)?.scrollIntoView({ block: 'nearest' });
    $('back').disabled = !hist.length; $('up').disabled = !cur.parent;
    list.setAttribute('aria-label', `Files in ${label(cur.path)}`);
    if (mode === 'browse') document.title = `Files — ${label(cur.path)}`;
  }
  async function go(path, { push = true, select = null, quiet = false } = {}) {
    const ticket = ++seq; setLoading(true);
    try {
      const data = await fetchList(path);
      if (ticket !== seq) return false;
      show(data, { push, select });
      return true;
    } catch (error) {
      if (ticket === seq && !quiet) { notice(error.message); if (!cur) showEmpty("Couldn't open this folder.", true, path); }
      return false;
    } finally { if (ticket === seq) setLoading(false); }
  }
  const up = () => { if (cur?.parent) go(cur.parent, { select: baseName(cur.path) }); };
  const back = () => { const p = hist.pop(); if (p) go(p, { push: false }); };

  // A typed path is a folder to enter, or a file to act on: never a silent no-op.
  async function goTyped(text, fromName = false) {
    const path = resolve(text);
    if (!path) { notice('Type a folder path, like ~/workspace.'); return; }
    const ticket = ++seq; setLoading(true);
    try {
      let data;
      try { data = await fetchList(path); } catch (first) {
        if (ticket !== seq) return;
        const name = baseName(path);
        let parent = null;
        try { parent = await fetchList(dirName(path)); } catch {}
        if (ticket !== seq) return;
        const hit = parent?.entries.find(e => e.name === name);
        if (!parent || (hit ? hit.dir : mode !== 'save')) throw first;
        show(parent, { select: name });
        if (mode === 'browse') { list.focus(); return openFile(hit.path); }
        if (mode === 'save') { setName(name); if (fromName) return trySave(); nameInput.focus(); return; }
        if (req.directory) throw new Error(`“${name}” is a file. Choose a folder.`);
        return answer([hit.path]);
      }
      if (ticket !== seq) return;
      show(data);
      if (fromName) { setName(''); nameInput.focus(); } else list.focus();
    } catch (error) {
      if (ticket === seq) notice(error.message);
    } finally { if (ticket === seq) setLoading(false); }
  }
  function editPath() {
    if (!cur) return;
    $('pathbox').classList.add('editing'); $('crumbs').hidden = $('path-edit').hidden = true;
    pathInput.hidden = false; pathInput.value = cur.path; pathInput.focus(); pathInput.select();
  }
  function stopEdit() {
    if (pathInput.hidden) return;
    const had = document.activeElement === pathInput;
    pathInput.hidden = true; $('crumbs').hidden = $('path-edit').hidden = false; $('pathbox').classList.remove('editing');
    if (had) (mode === 'save' ? nameInput : list).focus();
  }

  // Selection
  function afterSelect() {
    updateSel();
    const chosen = rows.filter(e => sel.has(e.path));
    if (mode === 'save' && chosen.length === 1 && !chosen[0].dir) setName(chosen[0].name);
  }
  function pick(i, extend) {
    if (extend && anchor >= 0) {
      const [a, b] = [Math.min(anchor, i), Math.max(anchor, i)];
      sel = new Set(rows.slice(a, b + 1).filter(selectable).map(e => e.path));
    } else { sel = new Set([rows[i].path]); anchor = i; }
    cursor = i; afterSelect();
    $('r' + i)?.scrollIntoView({ block: 'nearest' });
  }
  function moveBy(step, extend) {
    const ok = rows.map(selectable);
    if (!ok.includes(true)) return;
    let to;
    if (step === -Infinity) to = ok.indexOf(true);
    else if (step === Infinity) to = ok.lastIndexOf(true);
    else {
      const dir = Math.sign(step), target = cursor < 0 ? (dir > 0 ? 0 : rows.length - 1) : Math.max(0, Math.min(rows.length - 1, cursor + step));
      to = target; while (to >= 0 && to < rows.length && !ok[to]) to += dir;
      if (to < 0 || to >= rows.length) { to = target; while (!ok[to]) to -= dir; }
    }
    pick(to, extend);
  }
  function typeahead(ch) {
    const now = Date.now();
    typed = now - typedAt > 800 ? ch : typed + ch; typedAt = now;
    const q = typed.toLowerCase(), repeat = [...q].every(c => c === q[0]), needle = repeat ? q[0] : q;
    const start = cursor < 0 ? 0 : cursor + (q.length === 1 || repeat ? 1 : 0);
    for (let n = 0; n < rows.length; n++) {
      const i = (start + n) % rows.length;
      if (selectable(rows[i]) && rows[i].name.toLowerCase().startsWith(needle)) return pick(i, false);
    }
  }

  // Actions
  async function openFile(path) {
    try { await api('POST', '/fm/open', { path }); setStatus(`Opened “${baseName(path)}”`); } catch (error) { notice(error.message); }
  }
  function activate(i) {
    const e = rows[i];
    if (!e) return;
    if (e.dir) return go(e.path);
    if (!selectable(e)) return;
    if (mode === 'browse') return openFile(e.path);
    if (mode === 'open') { sel = new Set([e.path]); cursor = anchor = i; updateSel(); return doAccept(); }
    setName(e.name); trySave();
  }
  function doAccept() {
    if (busy || !cur) return;
    if (mode === 'save') return trySave();
    const chosen = rows.filter(e => sel.has(e.path));
    if (req.directory) {
      const dirs = chosen.filter(e => e.dir).map(e => e.path);
      return answer(dirs.length ? (req.multiple ? dirs : dirs.slice(0, 1)) : [cur.path]);
    }
    const files = chosen.filter(e => !e.dir).map(e => e.path);
    if (files.length) return answer(req.multiple ? files : files.slice(0, 1));
    if (chosen.length === 1) go(chosen[0].path);
  }
  function setName(value) { nameInput.value = value; hideConfirm(); updateFooter(); }
  function trySave() {
    if (!cur || busy) return;
    hideConfirm();
    const name = nameInput.value.trim();
    if (!name) { nameInput.focus(); return; }
    if (name.includes('/') || name === '.' || name === '..') return goTyped(name, true);
    const hit = cur.entries.find(e => e.name === name);
    if (hit?.dir) { setName(''); go(hit.path).then(() => nameInput.focus()); return; }
    if (hit) {
      $('confirm-text').textContent = `“${name}” already exists in “${label(cur.path)}”. Replace it?`;
      $('confirm').hidden = false; $('replace').focus(); return;
    }
    answer([join(cur.path, name)]);
  }
  async function answer(paths) {
    if (busy) return;
    busy = true; updateFooter();
    try {
      // Chromium will not let an app window close itself; this title is how
      // the computer finds this window to close once it has the answer.
      document.title = 'Closing ' + requestId;
      await api('POST', reqUrl, { paths, filter: activeFilter });
      answered = true; window.close();
      setTimeout(() => showEmpty('Done. You can close this window.'), 500);
    } catch (error) { notice(error.message); } finally { busy = false; updateFooter(); }
  }
  async function cancel() {
    document.title = 'Closing ' + requestId;
    if (!answered) { busy = true; try { await api('POST', reqUrl, { cancel: true }); answered = true; } catch {} }
    window.close();
  }
  async function copyPath() {
    const chosen = rows.filter(e => sel.has(e.path)).map(e => e.path);
    const text = (chosen.length ? chosen : [cur.path]).join('\n'), focused = document.activeElement;
    try { await navigator.clipboard.writeText(text); } catch {
      const area = el('textarea'); area.value = text; document.body.append(area); area.select();
      const ok = document.execCommand('copy'); area.remove(); focused?.focus();
      if (!ok) return notice("Couldn't copy to the clipboard.");
    }
    setStatus(chosen.length > 1 ? `Copied ${chosen.length} paths` : `Copied ${text}`);
  }
  function toggleHidden(on = !showHidden) {
    showHidden = on; $('show-hidden').checked = on;
    try { localStorage.setItem('files.hidden', on ? '1' : '0'); } catch {}
    if (cur) renderList();
  }

  // Events
  list.addEventListener('pointerdown', () => list.classList.remove('kbd'));
  list.addEventListener('click', event => {
    const row = event.target.closest('.row');
    if (!row) { if (event.target === list && !event.ctrlKey && !event.shiftKey) { sel = new Set(); cursor = anchor = -1; updateSel(); } return; }
    const i = +row.dataset.i, e = rows[i];
    if (!selectable(e)) return;
    if (multi() && (event.ctrlKey || event.metaKey)) {
      if (sel.has(e.path)) sel.delete(e.path); else sel.add(e.path);
      cursor = anchor = i; afterSelect();
    } else pick(i, multi() && event.shiftKey);
  });
  list.addEventListener('dblclick', event => { const row = event.target.closest('.row'); if (row) activate(+row.dataset.i); });
  list.addEventListener('keydown', event => {
    const k = event.key, ctrl = event.ctrlKey || event.metaKey;
    list.classList.add('kbd');
    if (ctrl && !event.altKey && k.toLowerCase() === 'a' && multi()) {
      event.preventDefault(); sel = new Set(rows.filter(selectable).map(e => e.path)); updateSel(); return;
    }
    if (ctrl || event.altKey) return;
    const steps = { ArrowDown: 1, ArrowUp: -1, PageDown: 10, PageUp: -10, Home: -Infinity, End: Infinity };
    if (Object.hasOwn(steps, k)) { event.preventDefault(); moveBy(steps[k], event.shiftKey && multi()); return; }
    if (k === 'Enter') {
      event.preventDefault();
      const e = rows[cursor];
      if (e?.dir) go(e.path); else if (mode === 'open') doAccept(); else if (e) activate(cursor);
      return;
    }
    if (k.length === 1 && (k !== ' ' || (typed && Date.now() - typedAt < 800))) { event.preventDefault(); typeahead(k); }
  });
  pathInput.addEventListener('keydown', event => {
    if (event.key === 'Enter') { event.preventDefault(); goTyped(pathInput.value); }
    else if (event.key === 'Escape') { event.preventDefault(); stopEdit(); list.focus(); }
  });
  pathInput.addEventListener('blur', () => setTimeout(() => { if (document.activeElement !== pathInput) stopEdit(); }, 0));
  $('path-edit').addEventListener('click', editPath);
  $('back').addEventListener('click', back);
  $('up').addEventListener('click', up);
  $('dismiss').addEventListener('click', dismiss);
  $('retry').addEventListener('click', () => retryPath && go(retryPath, { push: false }));
  $('show-hidden').addEventListener('change', event => toggleHidden(event.target.checked));
  $('terminal').addEventListener('click', async () => {
    try { await api('POST', '/fm/terminal', { path: cur.path }); setStatus(`Opened a terminal in ${cur.path}`); } catch (error) { notice(error.message); }
  });
  $('copy').addEventListener('click', copyPath);
  $('cancel').addEventListener('click', cancel);
  accept.addEventListener('click', doAccept);
  $('replace').addEventListener('click', () => answer([join(cur.path, nameInput.value.trim())]));
  $('keep').addEventListener('click', () => { hideConfirm(); nameInput.focus(); });
  nameInput.addEventListener('input', () => { hideConfirm(); updateFooter(); });
  nameInput.addEventListener('keydown', event => { if (event.key === 'Enter') { event.preventDefault(); trySave(); } });
  $('filter').addEventListener('change', () => {
    activeFilter = +$('filter').value; patterns = globs(req.filters[activeFilter]); if (cur) renderList();
  });
  const isText = t => t.tagName === 'INPUT' && t.type !== 'checkbox';
  document.addEventListener('keydown', event => {
    if (event.defaultPrevented) return;
    const k = event.key, ctrl = event.ctrlKey || event.metaKey;
    if (ctrl && !event.altKey && k.toLowerCase() === 'l') { event.preventDefault(); editPath(); }
    else if (ctrl && !event.altKey && k.toLowerCase() === 'h') { event.preventDefault(); toggleHidden(); }
    else if (event.altKey && k === 'ArrowUp') { event.preventDefault(); up(); }
    else if (event.altKey && k === 'ArrowLeft' && !isText(event.target)) { event.preventDefault(); back(); }
    else if (k === 'Backspace' && !ctrl && !event.altKey && !isText(event.target)) { event.preventDefault(); up(); }
    else if (k === 'Escape') {
      event.preventDefault();
      if (!$('confirm').hidden) { hideConfirm(); nameInput.focus(); }
      else if (reqUrl) cancel();
      else if (!$('notice').hidden) dismiss();
      else if (sel.size) { sel = new Set(); updateSel(); }
    }
  });
  // Closing the window any other way still answers the app, which would otherwise wait forever.
  // sendBeacon can't carry headers, so this one call carries the key in its query.
  addEventListener('pagehide', () => {
    if (reqUrl && !answered) navigator.sendBeacon(`${reqUrl}/cancel?key=${encodeURIComponent(key)}`);
  });

  // Start
  function setupPick() {
    mode = req.mode === 'save' ? 'save' : 'open';
    document.title = req.title || (mode === 'save' ? 'Save' : 'Open');
    $('heading').textContent = document.title;
    accept.hidden = false;
    accept.textContent = req.accept_label || (mode === 'save' ? 'Save' : 'Open');
    const filters = Array.isArray(req.filters) ? req.filters : [];
    if (filters.length) {
      activeFilter = Number.isInteger(req.current_filter) && req.current_filter < filters.length ? req.current_filter : 0;
      patterns = globs(filters[activeFilter]);
    }
    if (filters.length > 1) {
      $('filter').replaceChildren(...filters.map((f, i) => {
        const option = el('option'); option.value = String(i);
        option.textContent = f.name || (f.patterns || []).join(', ') || `Type ${i + 1}`;
        return option;
      }));
      $('filter').value = String(activeFilter); $('filter-field').hidden = false;
    }
    if (mode === 'save') {
      $('name-field').hidden = false; $('status').hidden = true;
      const name = req.current_name || '', dot = name.lastIndexOf('.');
      nameInput.value = name; nameInput.focus(); nameInput.setSelectionRange(0, dot > 0 ? dot : name.length);
    }
    list.setAttribute('aria-multiselectable', String(multi()));
    updateFooter();
  }
  async function start() {
    $('show-hidden').checked = showHidden;
    if (!key) { showEmpty('This window was opened without its key. Open it again from the computer.', true); return; }
    if (reqUrl) {
      $('cancel').hidden = false;
      try { req = await api('GET', reqUrl); } catch (error) { showEmpty(error.message, true); return; }
      setupPick();
      for (const p of [req.current_folder, WORKSPACE, HOME]) if (p && await go(p, { push: false, quiet: true })) break;
      if (!cur) { showEmpty("Couldn't open a folder to start in.", true, HOME); return; }
    } else {
      $('terminal').hidden = $('copy').hidden = false;
      list.setAttribute('aria-multiselectable', 'true');
      if (!await go(params.get('path') || HOME, { push: false })) await go(HOME, { push: false, quiet: true });
    }
    if (mode !== 'save') list.focus();
  }
  start();
})();
</script>
</body>
</html>
