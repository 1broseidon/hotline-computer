# The observer's terminal. It shows the agent's jobs; nobody types in it.
# Its colours are the bar's, so the desktop reads as one thing.

[window]
dynamic_title = false
decorations = "None"
padding = { x = 20, y = 18 }

[scrolling]
history = 20000

# Text copied in another app pastes on a right click, and text selected
# here goes to the clipboard, so the terminal and the browser share one.
[mouse]
bindings = [{ mouse = "Right", action = "Paste" }]

# Ctrl+V pastes here as it does in the browser: the viewer's paste presses
# it after filling the clipboard. Ctrl+Shift+V and Ctrl+Shift+C still work.
[keyboard]
bindings = [{ key = "V", mods = "Control", action = "Paste" }]

[selection]
save_to_clipboard = true

[font]
size = 10.5
offset = { x = 0, y = 3 }
normal = { family = "Geist Mono", style = "Regular" }
bold = { family = "Geist Mono", style = "Medium" }

# The cursor is painted in the background colour: the observer accepts no
# input, so a cursor would only suggest that it does.
[cursor]
style = { shape = "Underline", blinking = "Never" }

[colors.primary]
background = "#111114"
foreground = "#c9c9ce"

[colors.cursor]
text = "#111114"
cursor = "#111114"

[colors.normal]
black = "#19191e"
red = "#ff8f80"
green = "#86d69c"
yellow = "#f0c27a"
blue = "#8fb8ff"
magenta = "#c9a6f0"
cyan = "#8fdbd6"
white = "#ececef"

[colors.bright]
black = "#8e8e95"
red = "#ff8f80"
green = "#a4e3b5"
yellow = "#f5d39c"
blue = "#8fb8ff"
magenta = "#d9c0f5"
cyan = "#b0e6e2"
white = "#ffffff"
