<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hotline</title>
<style>
/* The desk's palette (src/viewer.html). Geist is not bundled here, so the
   system face stands in when it is not installed. */
:root {
  --ground:#0b0b0d; --surface:#17171b; --raised:#1f1f25; --raised-edge:#2e2e35; --rule:#2a2a30;
  --ink:#ececef; --ink-2:#b4b4ba; --muted:#8e8e95; --agent:#8fb8ff; --fail:#ff8f80;
}
* { box-sizing:border-box; }
[hidden] { display:none !important; }
html { background:var(--ground); }
body { margin:0; width:320px; color:var(--ink); font:13px/1.4 Geist, system-ui, sans-serif; }
header { display:flex; align-items:center; gap:8px; height:44px; padding:0 14px; border-bottom:1px solid var(--rule); }
header img { width:16px; height:16px; flex:none; }
h1 { margin:0; font-size:13px; font-weight:600; }
#site { margin-left:auto; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--muted); font:12px 'Geist Mono', ui-monospace, monospace; }
main { padding:6px; }
ul { list-style:none; margin:0; padding:0; }
li { display:flex; align-items:center; gap:10px; padding:7px 8px; border-radius:8px; }
li:hover { background:var(--surface); }
.who { flex:1; min-width:0; }
.who div { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.name { font-weight:500; }
.user { color:var(--muted); font-size:12px; }
button { flex:none; height:28px; padding:0 12px; border:1px solid var(--raised-edge); border-radius:8px; background:var(--raised); color:var(--ink); font:inherit; font-weight:500; cursor:pointer; }
button:hover:not(:disabled) { background:var(--raised-edge); }
button:disabled { opacity:.45; cursor:default; }
button:focus-visible { outline:2px solid var(--agent); outline-offset:2px; }
.note { margin:0; padding:14px 8px; color:var(--ink-2); text-align:center; }
#error { margin:6px 2px 2px; padding:8px 10px; border-radius:8px; background:var(--surface); border:1px solid var(--raised-edge); color:var(--fail); }
footer { padding:10px 14px 12px; border-top:1px solid var(--rule); color:var(--muted); font-size:11.5px; line-height:1.5; }
</style>
</head>
<body>
<header>
  <img src="icon-32.png" alt="">
  <h1>Hotline</h1>
  <span id="site"></span>
</header>
<main>
  <p id="status" class="note">Asking this computer…</p>
  <ul id="logins" aria-label="Logins for this site" hidden></ul>
  <p id="empty" class="note" hidden>No logins for this site. The person grants them in the desk.</p>
  <div id="error" role="alert" hidden></div>
</main>
<footer>Passkeys for any site are answered by this computer automatically; their keys never enter the browser.</footer>
<script src="popup.js"></script>
</body>
</html>
